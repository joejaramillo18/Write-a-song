// ===== src/persistence/storage.js =====
// storage.js
// Local-first persistence. The app never depends on a server to keep a song.
// A StorageAdapter is a tiny key/value contract; ProjectStore builds project
// save/load/list/delete on top of whichever adapter the environment provides.
//
//  - MemoryStorageAdapter  : tests, ephemeral use
//  - FileStorageAdapter    : desktop/server, one JSON file per project
//  - BrowserLocalStorageAdapter : the web app (uses window.localStorage)
//
// Deletion is real deletion (test scenario T029): remove() erases the record and
// keeps no hidden copy.


const PREFIX = 'song:';

class MemoryStorageAdapter {
  constructor() { this.map = new Map(); }
  async get(key) { return this.map.has(key) ? this.map.get(key) : null; }
  async set(key, value) { this.map.set(key, value); }
  async remove(key) { this.map.delete(key); }
  async keys() { return [...this.map.keys()]; }
}

class FileStorageAdapter {
  constructor(dir, fsmod, pathmod) {
    this.dir = dir;
    this.fs = fsmod;
    this.path = pathmod;
    if (!this.fs.existsSync(dir)) this.fs.mkdirSync(dir, { recursive: true });
  }
  _file(key) { return this.path.join(this.dir, `${encodeURIComponent(key)}.json`); }
  async get(key) {
    const f = this._file(key);
    return this.fs.existsSync(f) ? this.fs.readFileSync(f, 'utf8') : null;
  }
  async set(key, value) { this.fs.writeFileSync(this._file(key), value); }
  async remove(key) {
    const f = this._file(key);
    if (this.fs.existsSync(f)) this.fs.rmSync(f);
  }
  async keys() {
    return this.fs
      .readdirSync(this.dir)
      .filter((n) => n.endsWith('.json'))
      .map((n) => decodeURIComponent(n.replace(/\.json$/, '')));
  }
}

class BrowserLocalStorageAdapter {
  constructor(win = globalThis.window) {
    if (!win || !win.localStorage) throw new Error('localStorage is not available here.');
    this.ls = win.localStorage;
  }
  async get(key) { return this.ls.getItem(key); }
  async set(key, value) { this.ls.setItem(key, value); }
  async remove(key) { this.ls.removeItem(key); }
  async keys() {
    const out = [];
    for (let i = 0; i < this.ls.length; i += 1) out.push(this.ls.key(i));
    return out;
  }
}

class ProjectStore {
  constructor(adapter) { this.adapter = adapter; }

  async save(project) {
    const errors = validateProject(project);
    if (errors.length) throw new Error(`Refusing to save invalid project: ${errors.join('; ')}`);
    await this.adapter.set(PREFIX + project.id, JSON.stringify(project));
    return project.id;
  }

  async load(id) {
    const raw = await this.adapter.get(PREFIX + id);
    return raw ? migrateProject(JSON.parse(raw)) : null;
  }

  /** Lightweight summaries for a "your songs" list / returning-session check. */
  async list() {
    const keys = (await this.adapter.keys()).filter((k) => k.startsWith(PREFIX));
    const summaries = [];
    for (const k of keys) {
      const raw = await this.adapter.get(k);
      if (!raw) continue;
      const p = JSON.parse(raw);
      summaries.push({ id: p.id, title: p.title, updatedAt: p.updatedAt });
    }
    summaries.sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1));
    return summaries;
  }

  /** True when the writer has at least one saved project (returning session). */
  async hasAny() {
    return (await this.list()).length > 0;
  }

  /** Real delete — no retained copy. */
  async remove(id) {
    await this.adapter.remove(PREFIX + id);
  }

  /** Export one project as pretty JSON the writer can keep (data portability). */
  async exportProject(id) {
    const p = await this.load(id);
    return p ? JSON.stringify(p, null, 2) : null;
  }

  /** Export every project (for a full "download my data"). */
  async exportAll() {
    const out = [];
    for (const { id } of await this.list()) {
      const p = await this.load(id);
      if (p) out.push(p);
    }
    return out;
  }

  /** Delete every project. Returns how many were removed. No hidden copies remain. */
  async clearAll() {
    const keys = (await this.adapter.keys()).filter((k) => k.startsWith(PREFIX));
    for (const k of keys) await this.adapter.remove(k);
    return keys.length;
  }
}


// ===== src/board/RawMaterialBoard.js =====
// RawMaterialBoard.js
// Read-side helpers for the Raw Material Board. The board shows the writer's
// captured raw material and lets them see exactly what became of each piece and
// where every fragment traces back to. No content is generated here.

/** Build an id -> question lookup from the discovery_questions dataset. */
function indexQuestions(questions) {
  return new Map(questions.map((q) => [q.id, q]));
}

/**
 * Trace a fragment back through its source: fragment -> raw material entry ->
 * discovery question. Returns the whole chain, so the UI can answer "where did
 * this line come from?" with the writer's own words and the prompt that drew
 * them out. Returns null for fragments that were not extracted from raw material.
 */
function traceSource(project, fragment, questionsById = null) {
  const src = fragment.meta?.source;
  if (!src || src.type !== 'raw_material') return null;
  const raw = project.rawMaterial.find((r) => r.id === src.rawMaterialId) || null;
  const questionId = src.questionId ?? raw?.meta?.questionId ?? null;
  const question = questionId && questionsById ? questionsById.get(questionId) : null;
  return {
    fragmentId: fragment.id,
    text: fragment.text,
    rawMaterialId: src.rawMaterialId,
    rawText: raw?.text ?? null,
    span: src.span ?? null,
    questionId,
    questionPrompt: question?.prompt ?? null,
  };
}

/**
 * A board view: every raw entry annotated with the fragments extracted from it
 * and the discovery prompt that produced it. `used` is derived, never stored, so
 * it can't drift from the fragments that actually reference the entry.
 */
function boardView(project, questionsById = null) {
  const fragsByRaw = new Map();
  for (const section of project.sections) {
    for (const f of section.fragments) {
      const rid = f.meta?.source?.rawMaterialId;
      if (!rid) continue;
      if (!fragsByRaw.has(rid)) fragsByRaw.set(rid, []);
      fragsByRaw.get(rid).push({ fragmentId: f.id, sectionId: section.id, text: f.text });
    }
  }
  return project.rawMaterial.map((r) => {
    const extractedInto = fragsByRaw.get(r.id) || [];
    const qid = r.meta?.questionId ?? null;
    return {
      rawMaterialId: r.id,
      text: r.text,
      questionId: qid,
      questionPrompt: qid && questionsById ? (questionsById.get(qid)?.prompt ?? null) : null,
      extractedInto,
      used: extractedInto.length > 0,
    };
  });
}


// ===== src/truth/TruthSystem.js =====
// TruthSystem.js
// The truth system reflects the writer's OWN self-report back to them and offers
// the relevant truth-check questions. It never scores truth, and it never calls a
// line good or bad — the buckets use the writer's own scale labels from ui_copy.

// Which truth-check questions (from discovery_questions.json) fit each situation.
// These are offers, not verdicts.
const TRUTH_CHECK_BY_BUCKET = {
  hiding: ['Q065', 'Q070'],      // sounds good but isn't true / the real-life word
  coming_through: ['Q071'],      // a prettier version that's less true?
  exposed: ['Q066'],             // almost too honest to keep
  unrated: ['Q072'],             // the 1-5 rating prompt itself
};

/** The 5-point self-report scale, straight from ui_copy. */
function truthScale(uiCopy) {
  return uiCopy?.truth_meter?.scale ?? [];
}

function labelFor(uiCopy, value) {
  if (value == null) return null;
  return truthScale(uiCopy).find((s) => s.value === value)?.label ?? null;
}

/**
 * Bucket every rated and unrated fragment (and section) by the writer's own
 * rating, attach their scale label, and offer matching truth-check prompts.
 * buckets: hiding (1-2), coming_through (3-4), exposed (5), unrated (null).
 */
function truthReport(project, { uiCopy = null, questionsById = null } = {}) {
  const items = [];
  for (const section of project.sections) {
    for (const f of section.fragments) {
      const rating = 'truthRating' in f ? (f.truthRating ?? null) : null;
      items.push({
        kind: 'fragment', sectionId: section.id, id: f.id, text: f.text,
        rating, label: labelFor(uiCopy, rating),
      });
    }
    items.push({
      kind: 'section', sectionId: section.id, id: section.id, text: section.name,
      rating: section.truthRating ?? null, label: labelFor(uiCopy, section.truthRating ?? null),
    });
  }

  const buckets = { hiding: [], coming_through: [], exposed: [], unrated: [] };
  for (const it of items) {
    if (it.rating == null) buckets.unrated.push(it);
    else if (it.rating <= 2) buckets.hiding.push(it);
    else if (it.rating <= 4) buckets.coming_through.push(it);
    else buckets.exposed.push(it);
  }

  const prompts = {};
  for (const [bucket, ids] of Object.entries(TRUTH_CHECK_BY_BUCKET)) {
    prompts[bucket] = ids.map((id) => ({ id, prompt: questionsById?.get(id)?.prompt ?? null }));
  }

  return { buckets, prompts };
}


// ===== src/structure/StructureEngine.js =====
// StructureEngine.js
// Offers song structures from structure_recipes.json and, when the writer picks
// one, builds the sections for it. The recipe's rule rides along on each section
// as guidance the writer can follow or ignore — it is never enforced, and goals
// remain the writer's to set.

function indexStructures(recipes) {
  return new Map(recipes.map((r) => [r.id, r]));
}

function listStructures(recipes) {
  return recipes.map((r) => ({ id: r.id, name: r.name, form: r.form, best_for: r.best_for }));
}

/**
 * Apply a structure recipe to a project: record the choice and create one section
 * per form slot, carrying the slot label as the section role and the recipe's rule
 * as guidance. Refuses to clobber existing sections unless told to replace.
 */
function applyStructure(project, recipes, recipeId, { replace = false } = {}) {
  const recipe = indexStructures(recipes).get(recipeId);
  if (!recipe) throw new Error(`No structure recipe ${recipeId}`);
  if (project.sections.length && !replace) {
    throw new Error('Project already has sections; pass { replace: true } to rebuild the structure.');
  }
  if (replace) project.sections = [];
  setStructure(project, { recipeId: recipe.id, name: recipe.name, rule: recipe.rule, form: recipe.form });
  const sections = recipe.form.map((label) =>
    addSection(project, { name: label, role: label, structureRule: recipe.rule }));
  return { structure: project.structure, sections };
}

/**
 * Suggested goals for each section of a recipe, derived from the form label and
 * the recipe's rule. These are OFFERS, surfaced for the writer to accept, edit, or
 * ignore — nothing here writes a goal. (Use acceptGoal to record one.)
 */
function suggestGoals(recipe) {
  return recipe.form.map((label) => ({
    role: label,
    suggestion: goalHint(label, recipe),
  }));
}

function goalHint(label, recipe) {
  const l = label.toLowerCase();
  if (/verse\s*2|v2/.test(l)) return 'advance the story — reveal something Verse 1 did not know.';
  if (/verse/.test(l)) return 'set the scene with concrete, specific detail.';
  if (/pre/.test(l)) return 'change the momentum heading into the chorus.';
  if (/final chorus|chorus/.test(l)) return 'land the central statement; let repetition earn its meaning.';
  if (/bridge/.test(l)) return 'say the thing you were not ready to say earlier.';
  if (/refrain/.test(l)) return 'keep it stable enough to register; let context reshape it.';
  if (/outro|unresolved/.test(l)) return recipe.rule;
  return recipe.rule;
}

/** Record a goal the writer accepted for a section (their intention, their words). */
function acceptGoal(project, sectionId, goal) {
  return setSectionGoal(project, sectionId, goal);
}

// CraftEngine.js
// Offers craft moves from craft_recipes.json as experiments the writer opts into.
// Nothing here generates lyric text — a craft "experiment" records the move being
// tried and its guidance; the words stay the writer's. The one thing the engine
// does deterministically is surface title candidates from the writer's OWN
// language (craft move C005, "Title From Speech"), never invented phrases.

function indexCraft(recipes) {
  return new Map(recipes.map((r) => [r.id, r]));
}

function listCraft(recipes) {
  return recipes.map((r) => ({ id: r.id, name: r.name, mechanic: r.mechanic, pattern: r.pattern }));
}

/**
 * Start a craft experiment on a section: record which move is being tried and its
 * guidance, tagged as an opt-in experiment. No lyric is generated or altered.
 */
function startExperiment(project, recipes, sectionId, recipeId) {
  const recipe = indexCraft(recipes).get(recipeId);
  if (!recipe) throw new Error(`No craft recipe ${recipeId}`);
  const experiment = {
    recipeId: recipe.id,
    name: recipe.name,
    mechanic: recipe.mechanic,
    why: recipe.why,
    pattern: recipe.pattern,
    status: 'trying',
    startedAt: new Date().toISOString(),
  };
  addSectionExperiment(project, sectionId, experiment);
  return experiment;
}

/**
 * Title candidates drawn from the writer's own words (craft move C005). Pulls short
 * phrases from raw material and fragments — the writer's language, never invented —
 * so a title comes from something they already said. Returns them with their source.
 */
function titleCandidates(project, { minWords = 2, maxWords = 7 } = {}) {
  const seen = new Set();
  const out = [];
  const consider = (text, source) => {
    const phrase = (text || '').trim().replace(/\s+/g, ' ');
    const words = phrase.split(' ').filter(Boolean);
    if (words.length < minWords || words.length > maxWords) return;
    const key = phrase.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ text: phrase, source });
  };
  for (const r of project.rawMaterial) consider(r.text, { type: 'raw_material', id: r.id });
  for (const s of project.sections) {
    for (const f of s.fragments) consider(f.text, { type: 'fragment', id: f.id, sectionId: s.id });
  }
  return out;
}


// ===== src/craft/rhyme.js =====
// rhyme.js
// Deterministic rhyme helpers. IMPORTANT LIMITATION, stated plainly: this works on
// SPELLING, not pronunciation. It has no phonetic dictionary, so it will match
// "fine/line" but miss "tree/sea", and it can be fooled by English's irregular
// spelling. It is a useful, transparent aid — not an authority. The UI should
// present results as candidates, not verdicts.

const VOWELS = new Set('aeiouy');

function cleanWord(w) {
  return (w || '').toLowerCase().replace(/[^a-z]/g, '');
}

/** The orthographic rime: from the last vowel to the end of the word. */
function rime(word) {
  const w = cleanWord(word);
  for (let i = w.length - 1; i >= 0; i -= 1) {
    if (VOWELS.has(w[i])) return w.slice(i);
  }
  return w;
}

function lastVowel(word) {
  const w = cleanWord(word);
  for (let i = w.length - 1; i >= 0; i -= 1) if (VOWELS.has(w[i])) return w[i];
  return null;
}

function lastConsonant(word) {
  const w = cleanWord(word);
  for (let i = w.length - 1; i >= 0; i -= 1) if (!VOWELS.has(w[i])) return w[i];
  return null;
}

/** Perfect (orthographic) rhyme: same rime, different word. */
function perfectRhyme(a, b) {
  const ca = cleanWord(a);
  const cb = cleanWord(b);
  if (!ca || !cb || ca === cb) return false;
  return rime(a) === rime(b);
}

/**
 * Slant rhyme: not a perfect rhyme, but sharing either the final vowel (assonance)
 * or the final consonant (consonance).
 */
function slantRhyme(a, b) {
  if (perfectRhyme(a, b)) return false;
  const ca = cleanWord(a);
  const cb = cleanWord(b);
  if (!ca || !cb || ca === cb) return false;
  return lastVowel(a) === lastVowel(b) || lastConsonant(a) === lastConsonant(b);
}

/** Group a list of words by rime; returns only the groups with 2+ members. */
function rhymeGroups(words) {
  const groups = new Map();
  for (const w of words) {
    const r = rime(w);
    if (!r) continue;
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(w);
  }
  const out = [];
  for (const [r, members] of groups) {
    const unique = [...new Set(members.map((m) => m.toLowerCase()))];
    if (unique.length >= 2) out.push({ rime: r, words: unique });
  }
  return out;
}

/** Label the end-rhyme scheme of a list of lines as A, B, C... by last-word rime. */
function endRhymeScheme(lines) {
  const labels = [];
  const byRime = new Map();
  let next = 'A';
  for (const line of lines) {
    const words = line.trim().split(/\s+/).filter(Boolean);
    const last = words[words.length - 1];
    const r = rime(last || '');
    if (!byRime.has(r)) {
      byRime.set(r, next);
      next = String.fromCharCode(next.charCodeAt(0) + 1);
    }
    labels.push(byRime.get(r));
  }
  return labels;
}


// ===== src/craft/maps.js =====
// maps.js
// Repetition and "image" maps over the writer's own words. These surface patterns
// the writer already created — repeated words, repeated phrases, and motifs that
// recur across sections. Nothing is invented or interpreted; it is a mirror, not a
// critic. ("Image map" here means recurring content words and where they recur —
// the tool does not claim to understand imagery, only to show what returns.)

const STOPWORDS = new Set([
  'a', 'an', 'and', 'the', 'to', 'of', 'in', 'on', 'at', 'for', 'with', 'is', 'it',
  'i', 'you', 'he', 'she', 'we', 'they', 'me', 'my', 'your', 'his', 'her', 'our',
  'was', 'were', 'be', 'been', 'am', 'are', 'do', 'did', 'does', 'so', 'but', 'or',
  'if', 'then', 'that', 'this', 'these', 'those', 'as', 'like', 'not', 'no', 'yes',
  'up', 'down', 'out', 'into', 'over', 'under', 'just', 'still', 'all', 'can', 'will',
  'would', 'could', 'when', 'what', 'where', 'who', 'how', 'why', 'from', 'by',
]);

function tokenize(text) {
  return (text || '')
    .toLowerCase()
    .replace(/[^a-z0-9'\s]/g, ' ')
    .split(/\s+/)
    .filter(Boolean);
}

function contentWords(tokens) {
  return tokens.filter((t) => !STOPWORDS.has(t) && t.length > 1);
}

/**
 * Repetition map for a block of lines/text: repeated content words and repeated
 * multi-word phrases (2- and 3-grams that occur more than once).
 */
function repetitionMap(textOrLines) {
  const text = Array.isArray(textOrLines) ? textOrLines.join(' \n ') : textOrLines;
  const tokens = tokenize(text);

  const wordCounts = new Map();
  for (const w of contentWords(tokens)) wordCounts.set(w, (wordCounts.get(w) || 0) + 1);

  const phraseCounts = new Map();
  for (const n of [2, 3]) {
    for (let i = 0; i + n <= tokens.length; i += 1) {
      const gram = tokens.slice(i, i + n);
      if (gram.every((t) => STOPWORDS.has(t))) continue; // skip all-stopword phrases
      const key = gram.join(' ');
      phraseCounts.set(key, (phraseCounts.get(key) || 0) + 1);
    }
  }

  const words = [...wordCounts.entries()]
    .filter(([, c]) => c >= 2)
    .map(([word, count]) => ({ word, count }))
    .sort((a, b) => b.count - a.count || a.word.localeCompare(b.word));
  const phrases = [...phraseCounts.entries()]
    .filter(([, c]) => c >= 2)
    .map(([phrase, count]) => ({ phrase, count }))
    .sort((a, b) => b.count - a.count || a.phrase.localeCompare(b.phrase));

  return { words, phrases };
}

/**
 * Image/motif map across a project: content words that recur in 2+ places, with
 * where each appears. Shows the writer their own returning motifs across sections.
 */
function imageMap(project) {
  const occ = new Map(); // word -> [{sectionId, fragmentId}]
  for (const section of project.sections) {
    for (const f of section.fragments) {
      for (const w of new Set(contentWords(tokenize(f.text)))) {
        if (!occ.has(w)) occ.set(w, []);
        occ.get(w).push({ sectionId: section.id, fragmentId: f.id });
      }
    }
  }
  return [...occ.entries()]
    .filter(([, places]) => places.length >= 2)
    .map(([word, occurrences]) => ({ word, occurrences }))
    .sort((a, b) => b.occurrences.length - a.occurrences.length || a.word.localeCompare(b.word));
}


// ===== src/workshop/HarmonyLyricWorkshop.js =====
// HarmonyLyricWorkshop.js
// Phase 5: link a Sound Room choice to a section as its harmonic plan, then
// audition how that harmony sits with the words — aligned, contrasted, or
// ambiguous. Following the emotional-language policy: the structural facts are
// stated plainly, any emotional reading is offered only as a hypothesis, and the
// last word ("does this feel true?") always belongs to the writer.

const RELATIONS = ['aligned', 'contrasted', 'ambiguous'];

function indexContrast(recipes) {
  return new Map(recipes.map((r) => [r.id, r]));
}

const wTh = (statement) => ({ badge: BADGES.THEORY, statement });
const wHyp = (statement) => ({ badge: BADGES.HYPOTHESIS, statement });
const wYm = (statement) => ({ badge: BADGES.YOUR_MEANING, statement });

/**
 * Link a chosen Sound Room candidate to a section as its harmonic plan, recording
 * how the writer wants it to relate to the words. Carries a small structural
 * summary so the relationship can be explained later without recomputing.
 */
function attachPlan(project, sectionId, candidate, relation = 'ambiguous') {
  if (!RELATIONS.includes(relation)) throw new Error(`Unknown relation "${relation}"`);
  const f = candidate.structuralFeatures || {};
  const plan = {
    grammar: candidate.grammar,
    tonalCenter: candidate.tonalCenter,
    romanNumerals: candidate.romanNumerals,
    relationToWords: relation,
    sourceCandidateId: candidate.id,
    mode: candidate.mode,
    closure: f.closure ?? null,
    chromaticism: f.chromaticism ?? 0,
  };
  return setHarmonicPlan(project, sectionId, plan);
}

function closurePhrase(closure) {
  switch (closure) {
    case 'closed': return 'arrives on the tonic';
    case 'open_half': return 'withholds a full tonic arrival';
    case 'deceptive': return 'moves deceptively instead of resolving';
    case 'unresolved_loop': return 'loops without resolving';
    default: return 'moves through its chords';
  }
}

const RELATION_HYPOTHESIS = {
  aligned: 'Set to align, the music can move with the words rather than against them.',
  contrasted: "Set to contrast, the music can pull against the words, so one says something the other doesn't.",
  ambiguous: 'Left ambiguous, the music can avoid committing to a single reading.',
};

// Turn a recipe's "Ask: '…'" wrapper into the plain question.
function followupQuestion(recipe) {
  return (recipe.required_followup || '')
    .replace(/^Ask:\s*['"]?/i, '')
    .replace(/['"]\s*$/,'')
    .trim();
}

/**
 * Explain how the section's harmonic plan relates to its words, in the WHY format.
 * Structural facts are THEORY; the relationship reading is a hedged HYPOTHESIS; the
 * closing questions are the writer's. If the writer selected a contrast recipe, its
 * creative hypothesis and required follow-up are folded in (still as hypothesis +
 * the writer's question). Never asserts the lyric's emotion.
 */
function auditionRelationship(project, sectionId, { contrastRecipes = [], chosenRecipeId = null } = {}) {
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  const plan = section.harmonicPlan;
  if (!plan) throw new Error(`Section ${sectionId} has no harmonic plan yet`);

  const relation = plan.relationToWords || 'ambiguous';
  const out = [
    wTh(`Structurally, the harmony ${closurePhrase(plan.closure)}${plan.chromaticism > 0 ? ', with borrowed color' : ''}, in a ${plan.mode} center.`),
    wHyp(RELATION_HYPOTHESIS[relation] || RELATION_HYPOTHESIS.ambiguous),
  ];

  if (chosenRecipeId) {
    const recipe = indexContrast(contrastRecipes).get(chosenRecipeId);
    if (!recipe) throw new Error(`No contrast recipe ${chosenRecipeId}`);
    out.push(wHyp(`This might fit — ${recipe.creative_hypothesis}`));
    out.push(wYm(followupQuestion(recipe)));
  } else {
    out.push(wYm('Does that relationship feel true to what you are trying to say? Why or why not?'));
  }
  out.push(wYm('What did you hear?'));
  return { relation, explanation: out };
}

// A browsing aid: loosely group contrast recipes by the relation they tend to
// serve. This is a filter over the writer's menu, NOT a claim about their lyric.
function classifyRelation(recipe) {
  if (/^aligned/i.test(recipe.name)) return 'aligned';
  const hint = `${recipe.name} ${recipe.creative_hypothesis}`.toLowerCase();
  if (/(contrast|contradict|withhold|reveal|hidden|surface|against|complicate|while)/.test(hint)) {
    return 'contrasted';
  }
  return 'ambiguous';
}

function suggestContrastRecipes(relation, recipes) {
  return recipes
    .filter((r) => classifyRelation(r) === relation)
    .map((r) => ({ id: r.id, name: r.name, creative_hypothesis: r.creative_hypothesis }));
}

/**
 * The harmonic arc across sections: each section's plan, and the transition between
 * consecutive planned sections. A mode shift is described structurally, and where
 * it matches a known section-contrast pattern (minor→major or major→minor), that
 * recipe is offered as a hypothesis to explore — never as a statement about meaning.
 */
function harmonicArc(project) {
  const sections = project.sections.map((s) => ({
    sectionId: s.id, name: s.name, role: s.role, plan: s.harmonicPlan || null,
  }));
  const transitions = [];
  for (let i = 1; i < sections.length; i += 1) {
    const a = sections[i - 1];
    const b = sections[i];
    if (!a.plan || !b.plan) continue;
    const modeShift = a.plan.mode !== b.plan.mode;
    let hypothesisRecipeId = null;
    if (modeShift && a.plan.mode === 'minor' && b.plan.mode === 'major') hypothesisRecipeId = 'E009';
    else if (modeShift && a.plan.mode === 'major' && b.plan.mode === 'minor') hypothesisRecipeId = 'E010';
    transitions.push({
      from: a.sectionId,
      to: b.sectionId,
      description: modeShift
        ? `${a.name} is in ${a.plan.mode}; ${b.name} shifts to ${b.plan.mode}`
        : `${a.name} and ${b.name} stay in ${a.plan.mode}`,
      modeShift,
      hypothesisRecipeId,
    });
  }
  return { sections, transitions };
}

/** Record the writer's verdict on the relationship (their meaning, their call). */
function recordRelationshipFeedback(project, sectionId, { feelsTrue = null, note = null } = {}) {
  return setRelationshipFeedback(project, sectionId, { feelsTrue, note }, 'user');
}


// ===== src/collab/schema.js =====
// schema.js — the structured-output contract for LLM collaboration. The model must
// return JSON matching this shape; anything else is rejected and the engine falls
// back. Keeping the contract explicit is what lets deterministic code police the
// model's output instead of trusting free prose.

const SUGGESTION_TYPES = ['question', 'word_bank', 'line_alternative', 'direction', 'structural'];

// What each intervention mode is expected to produce (from ui_copy behaviors).
const MODE_TYPES = {
  coach: ['question', 'structural'],       // ask first; minimal, structural
  help: ['word_bank', 'structural', 'question'], // options after user input
  collaborate: ['line_alternative'],       // complete lines, clearly AI-marked
  rescue: ['direction'],                   // 3 substantially different directions
};

function validateSuggestions(output) {
  const errors = [];
  if (!output || typeof output !== 'object') return ['output must be an object'];
  if (!Array.isArray(output.suggestions)) return ['output.suggestions must be an array'];
  output.suggestions.forEach((s, i) => {
    if (!s || typeof s !== 'object') { errors.push(`suggestion ${i} must be an object`); return; }
    if (!SUGGESTION_TYPES.includes(s.type)) errors.push(`suggestion ${i}: unknown type "${s.type}"`);
    if (typeof s.text !== 'string' || !s.text.trim()) errors.push(`suggestion ${i}: missing text`);
  });
  return errors;
}


// ===== src/collab/guards.js =====
// guards.js — the deterministic checks that police the LLM boundary. These run on
// the model's output (and, for safety, on the writer's input) so the model can
// never diagnose, assert emotion as fact, claim personal meaning, or overwrite the
// deterministic theory. Rejections are returned with reasons, not silently dropped.

// --- Safety -----------------------------------------------------------------
// Conservative detection of credible, imminent self-harm / harm-to-others intent.
// On a hit, coaching pauses and the writer is pointed to immediate human support.
const IMMINENT = [
  /\bkill(ing)?\s+myself\b/i,
  /\bend(ing)?\s+my\s+life\b/i,
  /\btake\s+my\s+(own\s+)?life\b/i,
  /\bwant\s+to\s+die\b/i,
  /\b(going|about)\s+to\s+(kill|hurt|harm)\s+(myself|someone|him|her|them)\b/i,
  /\bsuicidal?\b/i,
  /\b(hurt|harm)\s+(myself|others|someone)\b/i,
];

const SAFETY_RESPONSE =
  'It sounds like you might be in real danger right now, and that matters more than the song. '
  + 'Please reach out for immediate help — contact your local emergency services or a crisis line '
  + 'in your area, or someone you trust who can be with you right now. I can\'t be that support, '
  + 'but I don\'t want you to be alone with this. We can come back to writing whenever you\'re ready.';

function safetyPrecheck(userText) {
  const t = userText || '';
  if (IMMINENT.some((re) => re.test(t))) return { safe: false, response: SAFETY_RESPONSE };
  return { safe: true };
}

// --- Meaning Lock -----------------------------------------------------------
const DIAGNOSIS = /\byou\s+(are|seem|sound|might\s+be|'re)\s+(depress|anxious|trauma|avoidant|bipolar|suicidal|manic|ocd|adhd|in\s+denial)/i;
const CAUSAL_EMOTION = /\b(makes?|make|causes?|will\s+make|guaranteed\s+to\s+(make|feel))\b[^.?!]*\b(sad|happy|anxious|angry|afraid|depressed|joyful|grief|calm|scared)\b/i;
const NAMED_EMOTION_CHORD = /\bthe\s+(grief|sad|sadness|happy|happiness|anxiety|anger|joy)\s+(chord|progression|key)\b/i;
const MEANING_CLAIM = /\byour\s+[\w']+\s+(symbol[iy][sz]es|represents|stands\s+for|means)\b/i;

const EMOTION_WORD = /\b(sad|happy|joy|joyful|grief|griev|angry|anger|anxious|anxiety|afraid|fear|depress|melanchol|nostalg|hopeful|longing|heartbreak|somber|mournful)\b/i;
const HEDGED = (s) => /\?\s*$/.test(s) || /\b(can|could|may|might|maybe|perhaps)\b/i.test(s);

/**
 * Reject suggestions that diagnose the writer, assert emotion as fact, name an
 * "emotion chord", or claim personal meaning. Emotional language is allowed only
 * when hedged as a hypothesis (and questions are always fine).
 */
function meaningLockGuard(suggestions) {
  const clean = [];
  const rejected = [];
  for (const s of suggestions) {
    const text = s.text || '';
    let reason = null;
    if (DIAGNOSIS.test(text)) reason = 'diagnoses the writer';
    else if (CAUSAL_EMOTION.test(text)) reason = 'asserts emotion as a guaranteed effect';
    else if (NAMED_EMOTION_CHORD.test(text)) reason = 'names an "emotion chord"';
    else if (MEANING_CLAIM.test(text)) reason = 'claims the meaning of the writer\'s material';
    else if (s.type !== 'question' && EMOTION_WORD.test(text) && !HEDGED(text)) {
      reason = 'states an emotional reading without hedging it as a hypothesis';
    }
    if (reason) rejected.push({ text, reason });
    else clean.push(s);
  }
  return { clean, rejected };
}

// --- Theory guard -----------------------------------------------------------
// The LLM must not compute or assert deterministic theory; that comes from the
// engine. Flag note-spellings and roman-numeral/spelling claims in model prose.
const NOTE_RUN = /\b[A-G](#|b|##|bb)?(\s*[-–,]?\s*[A-G](#|b|##|bb)?){2,}\b/;
const ROMAN_CLAIM = /\b(is|are|equals|=)\s+(the\s+)?(I|II|III|IV|V|VI|VII|i|ii|iii|iv|v|vi|vii)\b/;
const SPELL_PHRASE = /\bthe\s+notes\s+(are|in|of)\b|\bis\s+spelled\b|\bconsists?\s+of\s+the\s+notes\b/i;

/**
 * Reject suggestions that make theory claims. The deterministic theory engine is
 * the single source of truth for chord spellings and function (test T037).
 */
function theoryGuard(suggestions) {
  const clean = [];
  const rejected = [];
  for (const s of suggestions) {
    const text = s.text || '';
    if (NOTE_RUN.test(text) || ROMAN_CLAIM.test(text) || SPELL_PHRASE.test(text)) {
      rejected.push({ text, reason: 'makes a theory claim (theory comes from the deterministic engine)' });
    } else {
      clean.push(s);
    }
  }
  return { clean, rejected };
}


// ===== src/collab/LLMClient.js =====
// LLMClient.js — the provider-agnostic seam for LLM collaboration.
//
// The real client lives SERVER-SIDE (per the build phase): it implements
// complete({ mode, system, messages, schema }) by calling a model API with the
// system prompt this engine builds, requesting structured JSON output. It is
// intentionally NOT bundled into this offline prototype — no keys, no network.
//
// StubLLMClient is the offline stand-in: deterministic, schema-valid canned output
// per mode, so the whole collaboration pipeline (prompting, validation, guards,
// provenance, fallback) is testable without a model. It can also simulate an
// outage or inject deliberately bad output to exercise the guards.

class LLMClient {
  // eslint-disable-next-line no-unused-vars
  async complete(request) {
    throw new Error('LLMClient.complete is not implemented — provide a server-side client.');
  }
}

const CANNED = {
  coach: {
    suggestions: [
      { type: 'question', text: 'What did you notice first when this moment started?' },
      { type: 'question', text: "What would a camera have caught that you haven't said yet?" },
    ],
  },
  help: {
    suggestions: [
      { type: 'word_bank', text: 'porch, gravel, ignition, headlights, curb, doorway, hinge' },
      { type: 'structural', text: 'Try letting the second line answer the first instead of adding a new image.' },
    ],
  },
  collaborate: {
    suggestions: [
      { type: 'line_alternative', text: 'the porch light kept its watch while I backed away' },
      { type: 'line_alternative', text: "I left the light on like a question I couldn't ask" },
    ],
  },
  rescue: {
    suggestions: [
      { type: 'direction', text: 'Stay in the driveway the whole song; let time pass in one spot.' },
      { type: 'direction', text: "Address the person who isn't there, in second person." },
      { type: 'direction', text: 'Make the porch light the narrator, watching you leave.' },
    ],
  },
};

class StubLLMClient extends LLMClient {
  constructor({ fail = false, inject = null } = {}) {
    super();
    this.fail = fail;      // simulate an outage
    this.inject = inject;  // return this exact output (for guard tests)
  }

  async complete(request) {
    if (this.fail) throw new Error('LLM unavailable');
    if (this.inject) return this.inject;
    return CANNED[request.mode] ?? { suggestions: [] };
  }
}


// ===== src/collab/CollaborationEngine.js =====
// CollaborationEngine.js
// The controlled LLM boundary. It builds a request that carries the Meaning-Lock
// rules and any deterministic theory as fixed context, sends it through a client,
// then polices the response: schema-validate, strip theory claims, enforce Meaning
// Lock, tag every surviving line as an AI_SUGGESTION, and keep the writer's accept
// step explicit. If the model is unavailable, a deterministic fallback keeps the
// session alive. No deterministic theory is ever delegated to the model.

const MODES = ['coach', 'help', 'collaborate', 'rescue'];

const COLLAB_REMINDER =
  'These lines are AI-written suggestions — not yours until you choose them, and not about '
  + 'your real life unless you make them so. Your own words always win, and you can supply your '
  + 'own material at any point.';

/**
 * Build the request. The system prompt states the rules the model must follow and
 * injects the deterministic theory as FACTS the model may explain but must not
 * recompute or contradict. (The stub ignores the prompt; a real server-side client
 * sends it.)
 */
function buildRequest(mode, context = {}) {
  const theory = context.authoritativeTheory
    ? `\n\nDETERMINISTIC THEORY (authoritative — explain it, never recompute or contradict it):\n${JSON.stringify(context.authoritativeTheory)}`
    : '';
  const system = [
    'You are a songwriting collaborator inside a tool where the writer owns all meaning.',
    'Rules you must follow:',
    '- Meaning Lock: ask, never diagnose; never tell the writer what they feel or what their material means.',
    '- Emotional readings are allowed ONLY as clearly hedged hypotheses that ask the writer, never as fact.',
    '- Do not compute or assert music theory (chord spellings, scales, roman numerals); the tool computes those.',
    '- Everything you return is a reversible suggestion the writer may reject; never claim to have written the song.',
    `- Mode "${mode}": ${MODE_BEHAVIOR[mode] || ''}`,
    'Return only JSON matching the requested schema.',
    theory,
  ].join('\n');
  return { mode, system, messages: [{ role: 'user', content: context.userText || '' }], schema: MODE_TYPES[mode] || [] };
}

const MODE_BEHAVIOR = {
  coach: 'Ask questions first; keep any suggestions minimal and structural.',
  help: 'Offer word banks, options and structural alternatives after the writer\'s input.',
  collaborate: 'Offer complete line alternatives, clearly marked as AI-written.',
  rescue: 'Offer three substantially different directions, not one authoritative solution.',
};

/**
 * Run a collaboration turn. Returns one of:
 *  - { safety: true, response }         (imminent-danger input; coaching paused)
 *  - { offline: true, reason, suggestions, reminder? }   (model unavailable/invalid)
 *  - { mode, suggestions, rejected, reminder? }          (normal; suggestions tagged AI)
 */
async function collaborate(client, mode, context = {}) {
  if (!MODES.includes(mode)) throw new Error(`Unknown mode "${mode}"`);

  const safety = safetyPrecheck(context.userText || '');
  if (!safety.safe) return { safety: true, response: safety.response, suggestions: [] };

  const request = buildRequest(mode, context);
  let output;
  try {
    output = await client.complete(request);
  } catch (err) {
    return fallback(mode, context, `model unavailable (${err.message})`);
  }
  if (validateSuggestions(output).length) return fallback(mode, context, 'invalid structured output');

  // Theory claims are stripped first, then Meaning-Lock violations.
  const afterTheory = theoryGuard(output.suggestions);
  const afterMeaning = meaningLockGuard(afterTheory.clean);
  const rejected = [...afterTheory.rejected, ...afterMeaning.rejected];

  const suggestions = afterMeaning.clean.map((s) => ({
    type: s.type,
    text: s.text,
    badge: s.badge || null,
    fragment: asAiSuggestion(s.text, { mode, type: s.type }), // provenance-tagged
  }));

  const result = { mode, safety: false, suggestions, rejected };
  if (mode === 'collaborate') result.reminder = COLLAB_REMINDER; // T007
  return result;
}

// Deterministic fallback so an outage never disables the session (cf. T040).
function fallback(mode, context, reason) {
  const FALLBACKS = {
    coach: [{ type: 'question', text: 'What happened right before this moment?' }],
    help: [{ type: 'structural', text: 'Work from the words you already have — which line matters most?' }],
    collaborate: [{ type: 'structural', text: 'The collaborator is offline. Your own lines still stand; keep going with what\'s yours.' }],
    rescue: [
      { type: 'direction', text: 'Zoom in: stay on one small detail for the whole section.' },
      { type: 'direction', text: 'Zoom out: say where this sits in the larger story.' },
      { type: 'direction', text: 'Change who you\'re talking to.' },
    ],
  };
  return { offline: true, reason, mode, suggestions: FALLBACKS[mode] || [] };
}

/**
 * Accept a suggestion into the song. Adding a new fragment keeps its AI_SUGGESTION
 * provenance (honest: the writer didn't write it). Replacing an existing line goes
 * through the provenance guard — overwriting USER text needs the writer's confirmed
 * intent, and the prior version is preserved in history.
 */
function acceptSuggestion(project, sectionId, suggestion, { replaceFragmentId = null } = {}) {
  if (!suggestion.fragment) throw new Error('Only a tagged AI suggestion can be accepted.');
  if (replaceFragmentId) {
    return replaceFragmentText(
      project, replaceFragmentId, suggestion.fragment.text,
      PROVENANCE.AI_SUGGESTION, { intent: 'user_confirmed' },
    );
  }
  return addFragment(project, sectionId, suggestion.fragment);
}


// ===== src/handoff/LeadSheet.js =====
// LeadSheet.js
// Phase 7: turn a finished (or in-progress) project into a musician-ready handoff.
// It assembles structure, per-section chords (spelled deterministically from the
// stored roman numerals), lyrics with provenance, tempo/feel/key, and the list of
// things still unresolved. Nothing here implies the tool or an AI performs the song
// (test T010) — it hands the writer's work to a human player.

const PROV_MARK = {
  [PROVENANCE.USER]: 'you',
  [PROVENANCE.AI_SUGGESTION]: 'ai',
  [PROVENANCE.SYSTEM_ANALYSIS]: 'system',
  [PROVENANCE.THEORY_ENGINE]: 'engine',
};

const RELATION_PHRASE = { aligned: 'align with', contrasted: 'contrast', ambiguous: 'stay ambiguous against' };

// Spell a section's harmonic plan into chord symbols (from the engine, not stored).
function chordsFor(plan) {
  if (!plan || !Array.isArray(plan.romanNumerals)) return [];
  const chords = progressionToChords(plan.romanNumerals, { tonic: plan.tonalCenter, mode: plan.mode });
  return chords.map((c) => c.symbol);
}

// A single key summary if every planned section agrees, else "varies".
function keySummary(project) {
  const keys = new Set(
    project.sections.filter((s) => s.harmonicPlan).map((s) => `${s.harmonicPlan.tonalCenter} ${s.harmonicPlan.mode}`),
  );
  if (keys.size === 1) return [...keys][0];
  if (keys.size === 0) return project.settings?.tonalCenter || 'not set';
  return 'varies (see sections)';
}

/** The list of things still open — surfaced for the writer, never auto-resolved. */
function gatherUnresolved(project) {
  const out = [];
  for (const s of project.sections) {
    if (!s.fragments.length) out.push({ kind: 'empty_section', where: s.name, text: `${s.name} has no lyrics yet.` });
    if (s.harmonicPlan) {
      const fb = s.relationshipFeedback;
      if (!fb) out.push({ kind: 'relationship_unrated', where: s.name, text: `${s.name}: harmony chosen, but you haven't said whether it feels true.` });
      else if (fb.feelsTrue === false) out.push({ kind: 'relationship_false', where: s.name, text: `${s.name}: you marked the harmony/lyric relationship as not feeling true${fb.note ? ` — "${fb.note}"` : ''}.` });
    }
    for (const f of s.fragments) {
      if (f.truthRating != null && f.truthRating <= 2) {
        out.push({ kind: 'low_truth', where: s.name, text: `${s.name}: "${f.text}" — you rated this low on truth.` });
      }
    }
  }
  return out;
}

/** Assemble the structured lead sheet. */
function buildLeadSheet(project) {
  const sections = project.sections.map((s) => {
    const plan = s.harmonicPlan || null;
    return {
      name: s.name,
      role: s.role || null,
      goal: s.goal || null,
      relationToWords: plan?.relationToWords || null,
      romanNumerals: plan?.romanNumerals || [],
      chords: chordsFor(plan),
      lyrics: s.fragments.map((f) => ({ text: f.text, provenance: f.provenance, mark: PROV_MARK[f.provenance] || '?' })),
    };
  });
  const counts = {};
  for (const s of sections) for (const l of s.lyrics) counts[l.mark] = (counts[l.mark] || 0) + 1;
  return {
    title: project.title,
    key: keySummary(project),
    tempo: project.meta?.tempo ?? null,
    feel: project.meta?.feel ?? null,
    structure: project.structure?.name || null,
    sections,
    unresolved: gatherUnresolved(project),
    provenanceSummary: counts,
  };
}

/** Render the lead sheet as Markdown a musician can read (chords over lyrics, per section). */
function toMarkdown(sheet) {
  const L = [];
  L.push(`# ${sheet.title}`);
  const head = [`**Key:** ${sheet.key}`];
  if (sheet.tempo) head.push(`**Tempo:** ${sheet.tempo} BPM`);
  if (sheet.feel) head.push(`**Feel:** ${sheet.feel}`);
  if (sheet.structure) head.push(`**Form:** ${sheet.structure}`);
  L.push(head.join('  •  '));
  L.push('');
  L.push('_Chords are section-level (a progression per section), not aligned to individual words._');
  L.push('');

  for (const s of sheet.sections) {
    L.push(`## ${s.name}${s.role && s.role !== s.name ? ` _(${s.role})_` : ''}`);
    if (s.goal) L.push(`*Goal: ${s.goal}*`);
    if (s.chords.length) {
      L.push('```');
      L.push(`| ${s.chords.join(' | ')} |`);
      if (s.romanNumerals.length) L.push(`  ${s.romanNumerals.join('   ')}`);
      L.push('```');
      if (s.relationToWords) L.push(`_Harmony set to ${RELATION_PHRASE[s.relationToWords] || s.relationToWords} the words._`);
    }
    if (s.lyrics.length) {
      for (const l of s.lyrics) L.push(`${l.text}  \`(${l.mark})\``);
    } else {
      L.push('_(no lyrics yet)_');
    }
    L.push('');
  }

  L.push('---');
  L.push('### Still open');
  if (sheet.unresolved.length) for (const u of sheet.unresolved) L.push(`- ${u.text}`);
  else L.push('- Nothing flagged.');
  L.push('');
  L.push('### Provenance key');
  L.push('`(you)` = your words · `(ai)` = AI-suggested line you kept · `(engine)`/`(system)` = tool-generated');
  const cs = Object.entries(sheet.provenanceSummary).map(([k, v]) => `${k}: ${v}`).join(' · ');
  if (cs) L.push(`\nLines by source — ${cs}`);
  return L.join('\n') + '\n';
}

/** A compact chord map: section → progression. */
function toChordMap(sheet) {
  const L = [`${sheet.title} — chord map (${sheet.key})`];
  for (const s of sheet.sections) {
    L.push(`${s.name}: ${s.chords.length ? s.chords.join(' ') : '(no chords yet)'}`);
  }
  return L.join('\n') + '\n';
}

ent meaning?","purpose":"create structural development rather than repeated exposition","ai_rule":"Ask. Do not answer for the writer."},{"id":"Q079","category":"forward_motion","prompt":"What single phrase could survive every section and mean something different each time?","purpose":"create structural development rather than repeated exposition","ai_rule":"Ask. Do not answer for the writer."},{"id":"Q080","category":"forward_motion","prompt":"What is the smallest next step the narrator takes?","purpose":"create structural development rather than repeated exposition","ai_rule":"Ask. Do not answer for the writer."}],"ui_copy":{"product_voice":{"traits":["warm","curious","respectful","unhurried","specific","non-judgmental","never saccharine"],"avoid":["therapy-speak by default","fake praise","over-celebration","diagnosis","telling users what they feel","generic motivational quotes"],"core_rule":"Encourage the act of writing, not the quality of the user's pain."},"first_visit_headlines":["You do not need a song yet. Start with one true sentence.","Bring the feeling. We’ll help you find the song inside it.","You already have the raw material. Start where it hurts, glows, confuses, or refuses to leave.","No rhyme required. No music theory required. Just tell the truth as you know it.","A song can start with a person, a place, an object, a sentence, or something you cannot quite explain."],"first_visit_subcopy":["This space helps you turn your own experiences into lyrics, structure and chords. It will ask questions, explain choices and offer options. You remain the writer.","Write badly first. We can shape it later.","Nothing has to sound like a lyric until you are ready."],"returning_session_headlines":["Welcome back. Your song is still where you left it.","Ready to hear what changed since last time?","Come back to the line you could not stop thinking about.","You do not have to finish it today. Move one honest line forward.","Pick up the thread. What feels different now th developing evidence","rule":"Verse 2 must advance, not paraphrase."},{"id":"S002","name":"Verse–Pre–Chorus","form":["Verse 1","Pre","Chorus","Verse 2","Pre","Chorus","Bridge","Chorus"],"best_for":"songs that benefit from a tension ramp before the chorus","rule":"Pre-chorus should change function or momentum, not just add another verse."},{"id":"S003","name":"Refrain Verse","form":["Verse + Refrain","Verse + Refrain","Verse + Refrain","Closing Refrain"],"best_for":"storytelling where one repeated line gains new meaning","rule":"Keep the refrain stable enough to register; evolve context around it."},{"id":"S004","name":"AABA","form":["A1","A2","B","A3"],"best_for":"a recurring core idea with a contrasting bridge","rule":"A sections may vary lyrically while retaining recognizable musical identity."},{"id":"S005","name":"Strophic","form":["Verse 1","Verse 2","Verse 3","Verse 4"],"best_for":"narrative songs where music stays stable while words progress","rule":"Each stanza must earn its place through new information."},{"id":"S006","name":"Through-Composed","form":["Section A","Section B","Section C","Section D"],"best_for":"stories or emotional movement that resist repetition","rule":"Use recurring motifs to preserve coherence."},{"id":"S007","name":"Chorus First","form":["Chorus","Verse 1","Chorus","Verse 2","Chorus","Bridge","Chorus"],"best_for":"songs whose central statement is already known","rule":"Verses should complicate the opening claim."},{"id":"S008","name":"Slow Reveal","form":["Verse 1","Verse 2","Chorus","Verse 3","Chorus","Bridge/Outro"],"best_for":"songs where context must accumulate before the central statement lands","rule":"Delay should create discovery, not confusion."},{"id":"S009","name":"One-Scene Song","form":["Scene A","Deepen A","Turn","Return to A"],"best_for":"intimate writing anchored to one moment","rule":"Change interpretation rather than location."},{"id":"S010","name":"Before / After","form":["Before","Chorus","After","Chorus","What I
