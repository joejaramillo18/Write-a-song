 see, hear, touch, or notice.","pattern":"emotion -> physical evidence","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C002","name":"Surface vs Truth","mechanic":"Place what the narrator says beside what the narrator means.","why":"Useful for denial, politeness, masking, uncertainty and contradiction.","pattern":"public statement <-> private truth","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C003","name":"Object Anchor","mechanic":"Let one ordinary object carry recurring narrative weight.","why":"The object comes from the writer's real or imagined scene, not from AI invention unless requested.","pattern":"object + changing context","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C004","name":"Refrain Evolution","mechanic":"Repeat a phrase while changing the surrounding context so its meaning shifts.","why":"Repetition can provide familiarity while context creates development.","pattern":"constant phrase + changed meaning","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C005","name":"Title From Speech","mechanic":"Find a title inside the writer's natural language.","why":"Prefer phrases the user already wrote over invented poetic titles.","pattern":"user phrase -> title candidate","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C006","name":"Specific Before Universal","mechanic":"Start with a precise scene, then allow the listener to generalize.","why":"Specificity often gives the listener something concrete to inhabit.","pattern":"scene -> implication","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C007","name":"Delayed Explanation","mechanic":"Show an image before explaining it.","why":"Creates curiosity without requiring obscurity.","pattern":"image -> later context","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C008","name":"Question Chorus","mechanic":"Let the chorus carry a question the verses complicate.","why":"The chorus does not need to answer it.","pattern":"verse evidence -> repeated question","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C009","name":"Answer Chorus","mechanic":"Let the verses explore confusion and the chorus state the simplest truth available.","why":"Do not overstate certainty the writer does not feel.","pattern":"complexity -> simple thesis","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C010","name":"Perspective Shift","mechanic":"Change pronoun or vantage point between sections.","why":"Can reveal distance, accountability or re-interpretation.","pattern":"I -> you / we / they","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C011","name":"Time Jump","mechanic":"Move between then and now.","why":"Use a recurring detail to orient the listener.","pattern":"past scene -> present meaning","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C012","name":"Before / After","mechanic":"Construct two scenes around a change.","why":"Useful when the emotional event is a threshold.","pattern":"before -> event -> after","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C013","name":"Unsymmetrical Truth","mechanic":"Allow one line to be longer or structurally awkward when natural speech needs it.","why":"Craft should serve voice, not force every thought into identical line length.","pattern":"speech first -> meter refinement","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C014","name":"Internal Rhyme","mechanic":"Use rhyme inside lines rather than only at line endings.","why":"Can increase musicality without making the lyric feel nursery-like.","pattern":"internal sound echo","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C015","name":"Slant Rhyme","mechanic":"Use approximate sound relationships.","why":"Preserves vocabulary choice when perfect rhyme would distort meaning.","pattern":"meaning priority + sound kinship","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C016","name":"Rhyme Restraint","mechanic":"Deliberately leave important lines unrhymed.","why":"A break in pattern can attract attention, but effect is contextual.","pattern":"pattern -> intentional break","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C017","name":"Consonant Echo","mechanic":"Repeat consonant sounds across nearby words.","why":"Useful as a sound-shaping tool, not a substitute for meaning.","pattern":"alliteration / consonance","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C018","name":"Vowel Color","mechanic":"Notice repeated vowel shapes that may sing comfortably together.","why":"Treat as a vocal/melodic consideration, not an emotional law.","pattern":"assonance","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C019","name":"Compression","mechanic":"Remove a line that only restates the previous line.","why":"Ask whether the deletion increases force without losing necessary meaning.","pattern":"two statements -> one stronger statement","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C020","name":"Expansion","mechanic":"Stay with a detail longer instead of racing to the conclusion.","why":"Useful when the writer is summarizing rather than inhabiting the moment.","pattern":"summary -> scene","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C021","name":"Callback","mechanic":"Return to an earlier phrase or image near the end.","why":"The return can create coherence or altered meaning.","pattern":"early detail -> late return","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C022","name":"Bridge Revelation","mechanic":"Reserve a new truth, angle, admission or consequence for the bridge.","why":"A bridge should earn its existence by changing perspective, energy, harmony or information.","pattern":"established pattern -> new information","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C023","name":"Verse Escalation","mechanic":"Make Verse 2 advance the story rather than paraphrase Verse 1.","why":"Add consequence, contradiction, new time, new evidence or changed perspective.","pattern":"V1 state -> V2 development","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C024","name":"Hook By Reduction","mechanic":"Reduce the song's emotional thesis to the shortest phrase that still feels true.","why":"Short does not automatically mean better; truth outranks brevity.","pattern":"thesis -> compact phrase","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C025","name":"Hook By Collision","mechanic":"Place two ideas together that do not comfortably coexist.","why":"Use only when both are genuinely part of the writer's meaning.","pattern":"idea A + conflicting idea B","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C026","name":"Literal / Figurative Toggle","mechanic":"Test whether a metaphor clarifies or hides the truth.","why":"If the metaphor is generic, return to literal detail.","pattern":"literal <-> metaphor","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C027","name":"One Room Rule","mechanic":"Keep one verse inside one physical location.","why":"A constraint can increase specificity.","pattern":"single scene constraint","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C028","name":"One Moment Rule","mechanic":"Write a section from one short slice of time.","why":"Useful for writers who are summarizing years at once.","pattern":"time compression","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C029","name":"Unsent Message","mechanic":"Write the section as if it were a message that will never be sent.","why":"The writer decides whether any of it belongs in the final lyric.","pattern":"direct address exercise","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C030","name":"Witness Detail","mechanic":"Include one detail that proves the narrator was there.","why":"Avoid fabricated realism; use writer-supplied detail.","pattern":"specific evidence","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C031","name":"Emotional Misdirection","mechanic":"Let the lyric initially imply one meaning, then reveal another.","why":"Do not manufacture twist endings merely for cleverness.","pattern":"initial interpretation -> reframe","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C032","name":"Negative Space","mechanic":"Leave something unstated when the surrounding details make it legible.","why":"Ambiguity should invite interpretation, not conceal weak writing.","pattern":"evidence -> omission","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C033","name":"Plainspoken Line","mechanic":"Follow a poetic or image-heavy passage with an ordinary direct sentence.","why":"Contrast in language density can increase clarity.","pattern":"image -> plain truth","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C034","name":"Motif Transformation","mechanic":"Repeat an image, rhythm or phrase with a small alteration.","why":"The changed element should correspond to narrative movement when possible.","pattern":"motif A -> motif A'","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C035","name":"List With Turn","mechanic":"Use a list, then break it with a line that changes the meaning.","why":"Useful for accumulation and reveal.","pattern":"A, B, C -> turn","category":"songwriting_craft","fact_status":"craft_principle_not_law"},{"id":"C036","name":"End On Image","mechanic":"End a section on a concrete image instead of an explanatory emotion word.","why":"Let the user decide whether ambiguity or directness better serves the song.","pattern":"statement -> image","category":"songwriting_craft","fact_status":"craft_principle_not_law"}],"emotional_contrast_recipes":[{"id":"E001","name":"Aligned brightness","lyric_state":"positive/hopeful","music_direction":"major-oriented or consonant center","rhythm_direction":"energetic or open","creative_hypothesis":"Music and lyric broadly reinforce each other.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E002","name":"Aligned heaviness","lyric_state":"grief/loss/uncertainty","music_direction":"minor-oriented or tension-rich","rhythm_direction":"restrained or slow","creative_hypothesis":"Music and lyric broadly reinforce each other.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E003","name":"Smile over fracture","lyric_state":"dark/private pain","music_direction":"bright major-oriented","rhythm_direction":"upbeat","creative_hypothesis":"Surface can suggest normalcy while lyric reveals distress.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E004","name":"Hope with doubt","lyric_state":"hopeful","music_direction":"minor-oriented","rhythm_direction":"moderate","creative_hypothesis":"Harmony can complicate certainty without negating the lyric.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E005","name":"Defiant brightness","lyric_state":"anger/resolve","music_direction":"major/modal","rhythm_direction":"driving","creative_hypothesis":"Brightness can read as assertion rather than cheerfulness.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E006","name":"Tender conflict","lyric_state":"love + loss","music_direction":"major with borrowed minor","rhythm_direction":"gentle","creative_hypothesis":"Parallel-mode borrowing can color an otherwise major center.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E007","name":"False arrival","lyric_state":"unresolved lyric","music_direction":"strong cadence","rhythm_direction":"steady","creative_hypothesis":"Music resolves while the story does not; useful as intentional contradiction.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E008","name":"Refused arrival","lyric_state":"decisive lyric","music_direction":"deceptive or unresolved cadence","rhythm_direction":"driving","creative_hypothesis":"Harmony withholds closure while words claim certainty.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E009","name":"Dark verse / open chorus","lyric_state":"contained pain -> release","music_direction":"minor/ambiguous verse -> relative/parallel major chorus","rhythm_direction":"expanding","creative_hypothesis":"Section contrast can represent a change in stance.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E010","name":"Open verse / dark chorus","lyric_state":"surface ease -> private truth","music_direction":"major verse -> parallel/relative minor chorus","rhythm_direction":"drop or intensify","creative_hypothesis":"Chorus reveals weight hidden by verse.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E011","name":"Still words / restless music","lyric_state":"numb or restrained lyric","music_direction":"harmonic movement/tension","rhythm_direction":"active","creative_hypothesis":"Music can carry agitation the narrator does not verbalize.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E012","name":"Restless words / still music","lyric_state":"anxious/rapid thoughts","music_direction":"pedal/drone/minimal harmony","rhythm_direction":"steady","creative_hypothesis":"Stable foundation can contrast with verbal turbulence.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E013","name":"Comic shield","lyric_state":"pain described with humor","music_direction":"light/grooving","rhythm_direction":"upbeat","creative_hypothesis":"Contrast may reflect coping, distance or social masking; writer supplies meaning.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E014","name":"Memory glow","lyric_state":"painful memory with affection","music_direction":"major + chromatic shadow","rhythm_direction":"moderate","creative_hypothesis":"Allows warmth and loss to coexist.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E015","name":"Victory with cost","lyric_state":"achievement","music_direction":"major/modal with unresolved extension","rhythm_direction":"driving","creative_hypothesis":"Avoids making success emotionally one-dimensional.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E016","name":"Goodbye without collapse","lyric_state":"farewell","music_direction":"major/plagal","rhythm_direction":"slow/moderate","creative_hypothesis":"A farewell does not require minor harmony.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E017","name":"Love without certainty","lyric_state":"affection","music_direction":"suspended/add-tone/ambiguous","rhythm_direction":"moderate","creative_hypothesis":"Extensions or withheld thirds can preserve ambiguity.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E018","name":"Anger without speed","lyric_state":"anger","music_direction":"tense/low-register or static","rhythm_direction":"slow","creative_hypothesis":"Intensity can come from weight and delay rather than tempo.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E019","name":"Sadness with motion","lyric_state":"loss","music_direction":"major/minor flexible","rhythm_direction":"fast","creative_hypothesis":"Tempo and groove can contradict lyric weight.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E020","name":"Joy in minor","lyric_state":"celebration","music_direction":"minor/modal","rhythm_direction":"danceable","creative_hypothesis":"Mode does not dictate emotional message; groove and context matter.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E021","name":"Childlike surface / adult subtext","lyric_state":"simple language","music_direction":"simple major harmony","rhythm_direction":"steady","creative_hypothesis":"Simplicity can carry complex subtext if details do the work.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E022","name":"Plain truth / complex harmony","lyric_state":"direct confession","music_direction":"chromatic/extended","rhythm_direction":"flexible","creative_hypothesis":"Musical complexity can sit beneath linguistically simple lines.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E023","name":"Dense words / simple harmony","lyric_state":"complex narrative","music_direction":"two/four-chord loop","rhythm_direction":"steady","creative_hypothesis":"Simple harmony can give language more cognitive space.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"},{"id":"E024","name":"Ambiguous all around","lyric_state":"mixed emotion","music_direction":"modal/tonally ambiguous","rhythm_direction":"flexible","creative_hypothesis":"Do not force a single emotion when the writer does not feel one.","required_followup":"Ask: 'Does that relationship feel true to what you are trying to say? Why or why not?'","claim_status":"creative_hypothesis"}]};

// app.ui.js — the unified Songwriting Expression Tool app. Wrapped in an IIFE so
// its many locals never collide with the engine names inlined above it in the
// bundle. Every action calls a tested engine; the UI only renders and routes.
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- engines & data (DATA and engine names come from the bundle) ----------
  const discoveryEngine = new DiscoveryEngine(DATA.discovery_questions);
  const qById = indexQuestions(DATA.discovery_questions);
  const copy = new Copy(DATA.ui_copy);
  const audio = new AudioEngine();
  const collabClient = new StubLLMClient();

  // Storage: browser localStorage if we can, otherwise in-memory (never hard-fail).
  function makeStore() {
    try {
      const ls = globalThis.localStorage;
      if (ls) { ls.setItem('__probe', '1'); ls.removeItem('__probe'); return new ProjectStore(new BrowserLocalStorageAdapter()); }
    } catch { /* fall through */ }
    return new ProjectStore(new MemoryStorageAdapter());
  }
  const store = makeStore();
  const flow = new DiscoveryFlow(discoveryEngine, store);

  const state = {
    view: 'welcome', project: null, question: null,
    sound: { candidates: [], refined: false, playingId: null, blind: false },
  };

  async function save() {
    if (!state.project) return;
    try { await store.save(state.project); flashSaved(); } catch { /* ignore */ }
  }
  function flashSaved() {
    const el = $('#saved'); if (!el) return;
    el.textContent = 'saved'; el.classList.add('on');
    clearTimeout(flashSaved._t); flashSaved._t = setTimeout(() => el.classList.remove('on'), 1200);
  }
  function download(name, text, type = 'text/plain') {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  }

  // ---- routing --------------------------------------------------------------
  const STAGES = [
    ['welcome', 'Start'], ['discover', 'Discover'], ['board', 'Board'],
    ['shape', 'Shape'], ['sound', 'Sound'], ['workshop', 'Workshop'],
    ['collab', 'Collaborate'], ['handoff', 'Handoff'],
  ];
  async function show(view) {
    state.view = view;
    document.querySelectorAll('#nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
    const needsProject = !['welcome'].includes(view);
    $('#nav').style.visibility = state.project ? 'visible' : 'hidden';
    if (needsProject && !state.project) { view = 'welcome'; state.view = 'welcome'; }
    const render = VIEWS[view];
    $('#view').innerHTML = '<p class="muted">…</p>';
    $('#view').innerHTML = await render();
    afterRender(view);
  }

  // ---- WELCOME --------------------------------------------------------------
  async function renderWelcome() {
    const returning = await store.hasAny();
    const w = copy.welcome({ returning });
    const buttons = w.buttons.map((label) => {
      const path = BUTTON_TO_ENTRY_PATH[label];
      const act = path ? `start" data-path="${path}` : (label === 'Open my last song' ? 'openLast' : 'noop');
      return `<button class="chip" data-act="${act}">${esc(label)}</button>`;
    }).join('');
    return `
      <section class="hero">
        <h2>${esc(w.headline)}</h2>
        ${w.subcopy ? `<p class="sub">${esc(w.subcopy)}</p>` : ''}
        <div class="chips">${buttons}</div>
      </section>`;
  }

  async function startProject(path) {
    const started = await flow.begin({ entryPath: path });
    state.project = started.project;
    state.question = started.question || null;
    if (started.soundFirst) { await show('sound'); return; }
    await show('discover');
  }
  async function openLast() {
    const list = await store.list();
    if (!list.length) return;
    const resumed = await flow.resume(list[0].id);
    state.project = resumed.project; state.question = resumed.question;
    await show(resumed.question ? 'discover' : 'board');
  }

  // ---- DISCOVER -------------------------------------------------------------
  async function renderDiscover() {
    const q = state.question;
    const captured = state.project.rawMaterial.length;
    if (!q) {
      return `<section class="stage"><h3>That's a good pile of raw material.</h3>
        <p class="muted">You've captured ${captured} line${captured === 1 ? '' : 's'}. Take them to the board when you're ready.</p>
        <button class="primary" data-act="go" data-view="board">Go to the board →</button></section>`;
    }
    return `
      <section class="stage">
        <p class="qmeta">${esc(q.category)} · ${esc(q.ai_rule)}</p>
        <h3 class="question">${esc(q.prompt)}</h3>
        <textarea id="answer" rows="3" placeholder="say it plainly — no rhyme needed"></textarea>
        <div class="row">
          <button class="primary" data-act="capture">Capture &amp; continue</button>
          <button class="ghost" data-act="skip">Skip</button>
          <button class="ghost" data-act="go" data-view="board">I have enough →</button>
        </div>
        <p class="muted small">${captured} captured so far · ${esc(copy.microcopy(0))}</p>
      </section>`;
  }
  async function submitAnswer(text) {
    const res = await flow.submit(state.project, text || '');
    state.project = res.project; state.question = res.question;
    await save(); await show('discover');
  }

  // ---- BOARD ----------------------------------------------------------------
  async function renderBoard() {
    const view = boardView(state.project, qById);
    const raw = view.map((r) => `
      <li class="rawitem">
        <div class="rawtext">${esc(r.text)} ${r.used ? '<span class="pill">used</span>' : ''}</div>
        <div class="muted small">from: ${esc(r.questionPrompt || '—')}</div>
        <div class="row">
          <select data-role="sectionfor" data-raw="${r.rawMaterialId}">${sectionOptions()}</select>
          <button class="ghost" data-act="extract" data-raw="${r.rawMaterialId}">Pull in →</button>
        </div>
      </li>`).join('') || '<li class="muted">No raw material yet. Start in Discover.</li>';

    const sections = state.project.sections.map(renderSectionCard).join('') || '<p class="muted">No sections yet — add one, then pull lines into it.</p>';
    return `
      <section class="stage two-col">
        <div>
          <h3>Raw material</h3>
          <ul class="rawlist">${raw}</ul>
        </div>
        <div>
          <div class="row spread"><h3>Sections</h3>
            <span><input id="newsection" placeholder="new section (e.g. Verse 1)" />
            <button class="ghost" data-act="addsection">Add</button></span>
          </div>
          ${sections}
        </div>
      </section>`;
  }
  function sectionOptions() {
    if (!state.project.sections.length) return '<option value="">(add a section first)</option>';
    return state.project.sections.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  }
  const TRUTH = ['1', '2', '3', '4', '5'];
  function renderSectionCard(s) {
    const frags = s.fragments.map((f) => `
      <li class="frag">
        <span class="fragtext">${esc(f.text)}</span>
        <span class="prov ${f.provenance.toLowerCase()}">${f.provenance === 'USER' ? 'you' : f.provenance === 'AI_SUGGESTION' ? 'ai' : 'tool'}</span>
        <span class="truth" title="how true does this feel? (only you can say)">
          ${TRUTH.map((n) => `<button class="t ${String(f.truthRating) === n ? 'sel' : ''}" data-act="truth" data-frag="${f.id}" data-val="${n}">${n}</button>`).join('')}
        </span>
      </li>`).join('') || '<li class="muted small">(empty)</li>';
    return `<div class="seccard"><div class="row spread"><strong>${esc(s.name)}</strong>${s.harmonicPlan ? `<span class="pill">${esc(s.harmonicPlan.romanNumerals.join(' '))}</span>` : ''}</div>
      <ul class="fraglist">${frags}</ul></div>`;
  }

  // ---- SHAPE (structure + craft) --------------------------------------------
  async function renderShape() {
    const p = state.project;
    let structureBlock;
    if (!p.structure) {
      const opts = listStructures(DATA.structure_recipes).slice(0, 8).map((r) =>
        `<li><button class="ghost" data-act="applystructure" data-id="${r.id}">${esc(r.name)}</button> <span class="muted small">${esc(r.form.join(' · '))}</span></li>`).join('');
      structureBlock = `<h3>Pick a shape</h3><ul class="plainlist">${opts}</ul>`;
    } else {
      structureBlock = `<h3>Shape: ${esc(p.structure.name)}</h3><p class="muted small">${esc(p.structure.rule)}</p>`;
    }
    const secSel = `<select id="craftsection">${sectionOptions()}</select>`;
    const titles = titleCandidates(p).slice(0, 6).map((t) => `<li>${esc(t.text)}</li>`).join('') || '<li class="muted small">write more lines to surface titles</li>';
    const lines = p.sections.flatMap((s) => s.fragments.map((f) => f.text));
    const endWords = lines.map((l) => l.trim().split(/\s+/).pop()).filter(Boolean);
    const groups = rhymeGroups(endWords).map((g) => `<li>-${esc(g.rime)}: ${esc(g.words.join(', '))}</li>`).join('') || '<li class="muted small">no rhymes yet</li>';
    const rep = repetitionMap(lines).words.slice(0, 8).map((w) => `${esc(w.word)}×${w.count}`).join(', ') || 'none yet';
    const motifs = imageMap(p).slice(0, 8).map((m) => `${esc(m.word)} (${m.occurrences.length})`).join(', ') || 'none yet';
    const craftMoves = listCraft(DATA.craft_recipes).slice(0, 6).map((c) =>
      `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    return `
      <section class="stage">
        ${structureBlock}
        <hr/>
        <h3>Craft tools</h3>
        <div class="row">Section: ${secSel}
          <select id="craftmove">${craftMoves}</select>
          <button class="ghost" data-act="experiment">Try this move</button>
        </div>
        <div class="grid3">
          <div><h4>Titles from your words</h4><ul class="plainlist">${titles}</ul></div>
          <div><h4>Rhymes (by spelling)</h4><ul class="plainlist">${groups}</ul></div>
          <div><h4>Patterns</h4><p class="muted small">Repeated: ${rep}<br/>Motifs: ${motifs}</p></div>
        </div>
      </section>`;
  }

  // ---- SOUND ----------------------------------------------------------------
  async function renderSound() {
    const keys = ['C', 'G', 'D', 'A', 'E', 'F', 'Bb', 'Eb'];
    const profiles = [['SETTLE', 'Let it arrive'], ['BUILD_RELEASE', 'Build, then let go'], ['STAY_OPEN', 'Leave it hanging'], ['CIRCLE', 'Keep circling'], ['HOLD_STILL', 'Hold still']];
    const cards = state.sound.candidates.map(soundCard).join('');
    return `
      <section class="stage">
        <div class="controls">
          <label>Home note <select id="tonalCenter">${keys.map((k) => `<option>${k}</option>`).join('')}</select></label>
          <label>Palette <select id="palette"><option value="OPEN">Open</option><option value="MAJOR">Major</option><option value="MINOR">Minor</option><option value="MODAL">Modal</option></select></label>
          <label>Where it goes <select id="profile">${profiles.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select></label>
          <label>Simple→bold <input type="range" id="complexity" min="1" max="5" value="1"/></label>
          <label>Plain→colorful <input type="range" id="color" min="0" max="100" value="0"/></label>
        </div>
        <div class="row">
          <button class="primary" data-act="generate">Hear three directions</button>
          <label class="ghost"><input type="checkbox" id="blind"/> Listen blind</label>
        </div>
        <p id="note" class="muted" role="status" aria-live="polite"></p>
        <div class="results">${cards}</div>
      </section>`;
  }
  function soundCard(c) {
    const blind = state.sound.blind && !c._revealed;
    const labels = blind
      ? `<button class="ghost" data-act="reveal" data-id="${c.id}">Show what this is</button>`
      : `<div class="chords">${esc(c.chords.map((x) => x.symbol).join('  '))}</div>
         <div class="muted small">${esc(c.romanNumerals.join(' '))} · ${esc(c.grammar.toLowerCase())}</div>`;
    const attach = state.project.sections.length
      ? `<div class="row"><select data-role="attachsec" data-id="${c.id}">${sectionOptions()}</select>
         <select data-role="attachrel" data-id="${c.id}"><option value="aligned">align</option><option value="contrasted">contrast</option><option value="ambiguous" selected>ambiguous</option></select>
         <button class="ghost" data-act="attach" data-id="${c.id}">Use for section</button></div>` : '';
    return `<article class="direction ${state.sound.playingId === c.id ? 'playing' : ''}" data-id="${c.id}">
      <div class="row"><button class="play" data-act="play" data-id="${c.id}" aria-label="play">▶</button>
        <button class="play" data-act="stopaudio" aria-label="stop">◼</button>
        <button class="ghost" data-act="refine" data-id="${c.id}">Closer →</button></div>
      ${labels}${attach}</article>`;
  }
  function readIntent() {
    return createIntent({
      tonalCenter: $('#tonalCenter').value, palette: $('#palette').value,
      grammar: 'AUTO', profile: $('#profile').value,
      complexity: Number($('#complexity').value), chromaticColor: Number($('#color').value),
    });
  }

  // ---- WORKSHOP -------------------------------------------------------------
  async function renderWorkshop() {
    const planned = state.project.sections.filter((s) => s.harmonicPlan);
    if (!planned.length) return `<section class="stage"><p class="muted">No section has music yet. Go to Sound, pick a direction, and "Use for section".</p></section>`;
    const blocks = planned.map((s) => {
      const { explanation } = auditionRelationship(state.project, s.id, { contrastRecipes: DATA.emotional_contrast_recipes });
      const why = explanation.map((e) => `<p class="why ${e.badge.toLowerCase()}"><span class="badge">${badgeLabel(e.badge)}</span>${esc(e.statement)}</p>`).join('');
      const fb = s.relationshipFeedback;
      return `<div class="seccard"><div class="row spread"><strong>${esc(s.name)}</strong><span class="pill">${esc(s.harmonicPlan.romanNumerals.join(' '))} · ${esc(s.harmonicPlan.relationToWords)}</span></div>
        ${why}
        <div class="row">Does it feel true?
          <button class="ghost ${fb && fb.feelsTrue === true ? 'sel' : ''}" data-act="verdict" data-sec="${s.id}" data-val="yes">yes</button>
          <button class="ghost ${fb && fb.feelsTrue === false ? 'sel' : ''}" data-act="verdict" data-sec="${s.id}" data-val="no">not quite</button>
        </div></div>`;
    }).join('');
    const arc = harmonicArc(state.project).transitions.map((t) => `<li>${esc(t.description)}${t.hypothesisRecipeId ? ` <span class="muted small">(a pattern to explore: ${t.hypothesisRecipeId})</span>` : ''}</li>`).join('');
    return `<section class="stage"><h3>How the music sits with the words</h3>${blocks}
      ${arc ? `<h4>Across the song</h4><ul class="plainlist">${arc}</ul>` : ''}</section>`;
  }
  function badgeLabel(b) { return { THEORY: 'What it does', HYPOTHESIS: 'Might support', YOUR_MEANING: 'Your call', RESEARCH: 'Research', CRAFT: 'Craft' }[b] || b; }

  // ---- COLLABORATE ----------------------------------------------------------
  async function renderCollab() {
    const modes = [['coach', 'Coach me'], ['help', 'Help me'], ['collaborate', 'Collaborate'], ['rescue', "I'm stuck"]];
    return `<section class="stage">
      <p class="muted">A collaborator that never decides your meaning. Suggestions are AI-written until you choose them.</p>
      <div class="row">Section: <select id="collabsection">${sectionOptions()}</select></div>
      <textarea id="collabtext" rows="2" placeholder="what are you working on / stuck on?"></textarea>
      <div class="chips">${modes.map(([m, l]) => `<button class="chip" data-act="collab" data-mode="${m}">${esc(l)}</button>`).join('')}</div>
      <div id="collabout"></div>
    </section>`;
  }
  async function runCollab(mode) {
    const secId = $('#collabsection') ? $('#collabsection').value : null;
    const sec = state.project.sections.find((s) => s.id === secId);
    const ctx = { userText: $('#collabtext').value, authoritativeTheory: sec && sec.harmonicPlan ? { tonalCenter: sec.harmonicPlan.tonalCenter, romanNumerals: sec.harmonicPlan.romanNumerals } : null };
    const res = await collaborate(collabClient, mode, ctx);
    const out = $('#collabout');
    if (res.safety) { out.innerHTML = `<div class="safety">${esc(res.response)}</div>`; return; }
    const items = res.suggestions.map((s, i) => `<li>[${esc(s.type)}] ${esc(s.text)}
      ${s.fragment && secId ? `<button class="ghost" data-act="accept" data-mode="${mode}" data-i="${i}" data-sec="${secId}">keep in section</button>` : ''}</li>`).join('');
    state._lastSuggestions = res.suggestions;
    out.innerHTML = `${res.offline ? '<p class="muted small">collaborator offline — here\'s a deterministic nudge:</p>' : ''}
      <ul class="plainlist">${items}</ul>
      ${res.reminder ? `<p class="muted small">ⓘ ${esc(res.reminder)}</p>` : ''}
      ${res.rejected && res.rejected.length ? `<p class="muted small">${res.rejected.length} suggestion(s) blocked by the guards.</p>` : ''}`;
  }

  // ---- HANDOFF --------------------------------------------------------------
  async function renderHandoff() {
    const sheet = buildLeadSheet(state.project);
    const md = toMarkdown(sheet);
    return `<section class="stage">
      <div class="row"><h3>Lead sheet</h3>
        <button class="ghost" data-act="dl-md">Download .md</button>
        <button class="ghost" data-act="dl-map">Download chord map</button>
        <button class="ghost" data-act="dl-json">Export song (JSON)</button>
        <button class="ghost danger" data-act="delete">Delete this song</button>
      </div>
      <pre class="leadsheet">${esc(md)}</pre>
    </section>`;
  }

  // ---- action delegation ----------------------------------------------------
  const VIEWS = { welcome: renderWelcome, discover: renderDiscover, board: renderBoard, shape: renderShape, sound: renderSound, workshop: renderWorkshop, collab: renderCollab, handoff: renderHandoff };

  function afterRender(view) {
    if (view === 'sound') { const n = $('#note'); if (n && !state.sound.candidates.length) n.textContent = 'Set the dials, then hear three directions.'; }
  }

  document.addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    try {
      if (act === 'start') return startProject(b.dataset.path);
      if (act === 'openLast') return openLast();
      if (act === 'go') return show(b.dataset.view);
      if (act === 'capture') { const t = $('#answer').value; return submitAnswer(t); }
      if (act === 'skip') return submitAnswer('');
      if (act === 'addsection') { const n = $('#newsection').value.trim(); if (n) { addSection(state.project, { name: n }); await save(); } return show('board'); }
      if (act === 'extract') {
        const sel = document.querySelector(`[data-role="sectionfor"][data-raw="${b.dataset.raw}"]`);
        if (sel && sel.value) { extractFragment(state.project, { rawMaterialId: b.dataset.raw, sectionId: sel.value }); await save(); }
        return show('board');
      }
      if (act === 'truth') { setFragmentTruth(state.project, b.dataset.frag, Number(b.dataset.val), 'user'); await save(); return show('board'); }
      if (act === 'applystructure') { applyStructure(state.project, DATA.structure_recipes, b.dataset.id, { replace: true }); await save(); return show('shape'); }
      if (act === 'experiment') { const sec = $('#craftsection').value; const mv = $('#craftmove').value; if (sec) { startExperiment(state.project, DATA.craft_recipes, sec, mv); await save(); } return; }
      if (act === 'generate') { state.sound.blind = $('#blind').checked; state.sound.refined = false; const r = audition(readIntent(), { blind: state.sound.blind }); state.sound.candidates = r.candidates; audio.stop(); state.sound.playingId = null; await show('sound'); const n = $('#note'); if (n) n.textContent = state.sound.blind ? 'Listen first — which is closer to what you mean?' : 'Three directions. Play each, then choose.'; return; }
      if (act === 'play') { const c = state.sound.candidates.find((x) => x.id === b.dataset.id); audio.play(c, { tempo: 84, texture: 'pad' }); state.sound.playingId = c.id; document.querySelectorAll('.direction').forEach((el) => el.classList.toggle('playing', el.dataset.id === c.id)); return; }
      if (act === 'stopaudio') { audio.stop(); state.sound.playingId = null; document.querySelectorAll('.direction').forEach((el) => el.classList.remove('playing')); return; }
      if (act === 'reveal') { const c = state.sound.candidates.find((x) => x.id === b.dataset.id); c._revealed = true; return show('sound'); }
      if (act === 'refine') { const c = state.sound.candidates.find((x) => x.id === b.dataset.id); state.sound.candidates = refine(c, { blind: state.sound.blind }).variants; await show('sound'); const n = $('#note'); if (n) n.textContent = 'Three variations — each changes one thing.'; return; }
      if (act === 'attach') {
        const c = state.sound.candidates.find((x) => x.id === b.dataset.id);
        const sec = document.querySelector(`[data-role="attachsec"][data-id="${b.dataset.id}"]`).value;
        const rel = document.querySelector(`[data-role="attachrel"][data-id="${b.dataset.id}"]`).value;
        if (sec) { attachPlan(state.project, sec, c, rel); await save(); }
        return show('workshop');
      }
      if (act === 'verdict') { recordRelationshipFeedback(state.project, b.dataset.sec, { feelsTrue: b.dataset.val === 'yes' }); await save(); return show('workshop'); }
      if (act === 'collab') return runCollab(b.dataset.mode);
      if (act === 'accept') { const s = state._lastSuggestions[Number(b.dataset.i)]; if (s && s.fragment) { acceptSuggestion(state.project, b.dataset.sec, s, {}); await save(); } return; }
      if (act === 'dl-md') return download(`${slug(state.project.title)}-lead-sheet.md`, toMarkdown(buildLeadSheet(state.project)), 'text/markdown');
      if (act === 'dl-map') return download(`${slug(state.project.title)}-chords.txt`, toChordMap(buildLeadSheet(state.project)));
      if (act === 'dl-json') { const j = await store.exportProject(state.project.id); return download(`${slug(state.project.title)}.json`, j || '{}', 'application/json'); }
      if (act === 'delete') { if (confirm('Delete this song? This cannot be undone.')) { await store.remove(state.project.id); state.project = null; return show('welcome'); } }
    } catch (e) { console.error(e); }
  });
  function slug(s) { return String(s || 'song').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'song'; }

  // ---- nav + boot -----------------------------------------------------------
  $('#nav').innerHTML = STAGES.map(([v, l]) => `<button data-view="${v}" data-act="go">${esc(l)}</button>`).join('');
  show('welcome');
})();

</script>
</body>
</html>
