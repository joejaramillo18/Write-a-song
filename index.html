<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songwriting Expression Tool</title>
<style>
/* app.css — the unified app, same quiet room as the Sound Room. */
:root {
  --room: #14161d; --panel: #1b1e28; --panel-2: #262a37; --edge: #2c3040;
  --ink: #e8e5dc; --muted: #8b90a4; --lamp: #e0a869; --lamp-soft: rgba(224,168,105,0.16);
  --danger: #d98a8a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% -10%, #1b1f2b 0%, var(--room) 55%) fixed;
  color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 1.6rem 1.2rem 4rem; }

header.top { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.8rem; }
header.top h1 { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; margin: 0; }
#saved { color: var(--muted); font-size: 0.8rem; opacity: 0; transition: opacity 0.3s; }
#saved.on { opacity: 1; }

#nav { display: flex; flex-wrap: wrap; gap: 0.3rem; border-bottom: 1px solid var(--edge); padding-bottom: 0.7rem; margin-bottom: 1.4rem; }
#nav button { font: inherit; font-size: 0.9rem; background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer; }
#nav button:hover { color: var(--ink); }
#nav button[aria-current="page"] { color: var(--room); background: var(--lamp); }

h2 { font-family: var(--serif); font-weight: 500; }
h3, h4 { margin: 0.2rem 0 0.6rem; }
.muted { color: var(--muted); } .small { font-size: 0.85rem; }
hr { border: 0; border-top: 1px solid var(--edge); margin: 1.4rem 0; }
.row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; }
.row.spread { justify-content: space-between; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; }
@media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

button.primary { font: inherit; background: var(--lamp); color: #201400; border: 0; padding: 0.6rem 1.1rem; border-radius: 9px; cursor: pointer; font-weight: 600; }
button.ghost { font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer; }
button.ghost:hover { border-color: var(--lamp); }
button.ghost.sel { background: var(--lamp); color: var(--room); border-color: var(--lamp); }
button.ghost.danger:hover { border-color: var(--danger); color: var(--danger); }
select, input[type="text"], input:not([type]), textarea { background: var(--panel-2); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 0.45rem 0.55rem; font: inherit; }
textarea { width: 100%; resize: vertical; }
input[type="range"] { accent-color: var(--lamp); }
label { color: var(--muted); font-size: 0.86rem; display: inline-flex; gap: 0.4rem; align-items: center; }

.hero { text-align: center; padding: 3rem 1rem; }
.hero h2 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); max-width: 24ch; margin: 0 auto 0.6rem; }
.hero .sub { color: var(--muted); max-width: 44ch; margin: 0 auto 1.6rem; font-family: var(--serif); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
.chip { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 20px; padding: 0.5rem 1rem; cursor: pointer; }
.chip:hover { border-color: var(--lamp); color: var(--lamp); }

.stage { animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stage { animation: none; } }
.qmeta { color: var(--muted); font-size: 0.8rem; margin: 0; }
.question { font-family: var(--serif); font-size: 1.5rem; font-weight: 500; }

.rawlist, .fraglist, .plainlist { list-style: none; padding: 0; margin: 0; }
.rawitem { border: 1px solid var(--edge); border-radius: 10px; padding: 0.7rem 0.8rem; margin-bottom: 0.7rem; background: var(--panel); }
.rawtext { margin-bottom: 0.2rem; }
.pill { background: var(--panel-2); color: var(--muted); border: 1px solid var(--edge); border-radius: 12px; font-size: 0.72rem; padding: 0.05rem 0.5rem; }
.seccard { border: 1px solid var(--edge); border-radius: 10px; padding: 0.7rem 0.8rem; margin-bottom: 0.8rem; background: var(--panel); }
.frag { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; flex-wrap: wrap; }
.fragtext { flex: 1; }
.prov { font-size: 0.7rem; border-radius: 10px; padding: 0.02rem 0.4rem; border: 1px solid var(--edge); color: var(--muted); }
.prov.user { color: var(--lamp); border-color: var(--lamp); }
.truth .t { font: inherit; font-size: 0.75rem; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel-2); color: var(--muted); cursor: pointer; }
.truth .t.sel { background: var(--lamp); color: var(--room); border-color: var(--lamp); }
.plainlist li { padding: 0.15rem 0; }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 1rem 1.1rem; }
.controls label { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
.controls select, .controls input { width: 100%; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
.direction { background: var(--panel); border: 1px solid var(--edge); border-top: 2px solid var(--edge); border-radius: 11px; padding: 0.9rem; transition: border-color 0.35s, box-shadow 0.35s; }
.direction.playing { border-top-color: var(--lamp); box-shadow: 0 10px 40px -18px var(--lamp-soft); background: linear-gradient(180deg, var(--lamp-soft), transparent 40%), var(--panel); }
.play { font-size: 0.95rem; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel-2); color: var(--ink); cursor: pointer; }
.play:hover { border-color: var(--lamp); color: var(--lamp); }
.chords { font-family: var(--serif); font-size: 1.3rem; margin: 0.5rem 0 0.2rem; }

.why { margin: 0.4rem 0; font-size: 0.92rem; }
.why.hypothesis { color: #cfd3e0; font-style: italic; }
.why.your_meaning { color: var(--muted); }
.badge { display: inline-block; margin-right: 0.5rem; padding: 0.04rem 0.5rem; border-radius: 20px; font-size: 0.7rem; background: var(--panel-2); color: var(--muted); border: 1px solid var(--edge); }
.why.theory .badge { color: var(--lamp); border-color: var(--lamp); }

.leadsheet { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 1rem 1.1rem; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; color: var(--ink); overflow-x: auto; }
.safety { border: 1px solid var(--lamp); background: var(--lamp-soft); border-radius: 10px; padding: 1rem; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Songwriting Expression Tool</h1>
    <span id="saved" aria-live="polite"></span>
  </header>
  <nav id="nav" aria-label="Stages"></nav>
  <main id="view"></main>
</div>
<script type="module">
// ===== src/theory/notes.js =====
// notes.js
// The foundation of the whole theory engine.
//
// We never represent a pitch by its pitch-class number alone (0-11), because a
// pitch class cannot tell F# apart from Gb, or E# apart from F. Those are
// different notes even though they sound the same, and spelling them correctly
// is exactly what makes a theory engine trustworthy. So a note is a LETTER plus
// an ACCIDENTAL offset. Spelling then falls out of interval arithmetic instead
// of a lookup table, which is what lets us get F##, B#, Cb and E# right.

const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

// Semitone value of each natural letter within an octave.
const LETTER_SEMITONE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

const ACCIDENTAL_TO_STR = { '-2': 'bb', '-1': 'b', '0': '', '1': '#', '2': '##' };

/**
 * Parse a note name like "C", "F#", "Bb", "F##", "Cb" into { letter, accidental }.
 * accidental is a signed integer: -2 bb, -1 b, 0 natural, +1 #, +2 ##.
 */
function parseNote(name) {
  if (typeof name !== 'string' || name.length === 0) {
    throw new Error(`Invalid note: ${JSON.stringify(name)}`);
  }
  const letter = name[0].toUpperCase();
  if (!LETTERS.includes(letter)) {
    throw new Error(`Invalid note letter in "${name}"`);
  }
  const suffix = name.slice(1);
  let accidental = 0;
  if (suffix === '' ) accidental = 0;
  else if (/^#+$/.test(suffix)) accidental = suffix.length;
  else if (/^b+$/.test(suffix)) accidental = -suffix.length;
  else if (suffix === '♯') accidental = 1;
  else if (suffix === '♭') accidental = -1;
  else throw new Error(`Invalid accidental in "${name}"`);
  return { letter, accidental };
}

/** Render a { letter, accidental } note back to a string. */
function noteToString(note) {
  const acc = ACCIDENTAL_TO_STR[String(note.accidental)];
  if (acc === undefined) {
    // Fall back for triple+ accidentals rather than throwing.
    const n = note.accidental;
    return note.letter + (n > 0 ? '#'.repeat(n) : 'b'.repeat(-n));
  }
  return note.letter + acc;
}

/** Pitch class (0-11) of a note. */
function pitchClass(note) {
  return (((LETTER_SEMITONE[note.letter] + note.accidental) % 12) + 12) % 12;
}

/**
 * Given a target letter and a target pitch class, choose the accidental that
 * spells that pitch class on that letter. Returns the smallest-magnitude
 * accidental in the range [-5, 6] (in practice always within [-2, 2] for the
 * diatonic material this engine generates).
 */
function accidentalForPitchClass(letter, targetPc) {
  const natural = LETTER_SEMITONE[letter];
  let raw = (((targetPc - natural) % 12) + 12) % 12; // 0..11
  if (raw > 6) raw -= 12; // fold to -5..6 so we prefer flats/sharps over huge stacks
  return raw;
}

/**
 * Spell a note that is `letterSteps` diatonic steps above `reference` and
 * `semitones` semitones above it. This single primitive powers both scale
 * spelling (letterStep 1 per degree) and chord spelling (letterStep 2 per
 * stacked third), guaranteeing consistent enharmonic results.
 */
function spellFrom(reference, letterSteps, semitones) {
  const refLetterIndex = LETTERS.indexOf(reference.letter);
  const letter = LETTERS[(((refLetterIndex + letterSteps) % 7) + 7) % 7];
  const targetPc = (((pitchClass(reference) + semitones) % 12) + 12) % 12;
  return { letter, accidental: accidentalForPitchClass(letter, targetPc) };
}


// ===== src/theory/ScaleEngine.js =====
// ScaleEngine.js — deterministic scale spelling.

// Semitone formulas (from data/music_theory_core.json scale_formulas).
const SCALE_FORMULAS = {
  major: [0, 2, 4, 5, 7, 9, 11],
  natural_minor: [0, 2, 3, 5, 7, 8, 10],
  harmonic_minor: [0, 2, 3, 5, 7, 8, 11],
  melodic_minor_ascending: [0, 2, 3, 5, 7, 9, 11],
  dorian: [0, 2, 3, 5, 7, 9, 10],
  phrygian: [0, 1, 3, 5, 7, 8, 10],
  lydian: [0, 2, 4, 6, 7, 9, 11],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  aeolian: [0, 2, 3, 5, 7, 8, 10],
  locrian: [0, 1, 3, 5, 6, 8, 10],
};

/**
 * Build a scale as an array of { letter, accidental } notes.
 * Each successive degree gets the next letter, so a 7-note scale always uses
 * all seven letters exactly once — the reason spellings stay correct.
 */
function buildScaleNotes(tonic, scaleName) {
  const formula = SCALE_FORMULAS[scaleName];
  if (!formula) throw new Error(`Unknown scale: ${scaleName}`);
  const root = typeof tonic === 'string' ? parseNote(tonic) : tonic;
  return formula.map((semis, i) => spellFrom(root, i, semis));
}

/** Same, returned as note-name strings. */
function buildScale(tonic, scaleName) {
  return buildScaleNotes(tonic, scaleName).map(noteToString);
}


// ===== src/theory/ChordEngine.js =====
// ChordEngine.js — deterministic chord spelling and quality classification.

// Each chord tone carries its CHORDAL DEGREE (1,2,3,4,5,6,7,9...) plus its
// semitone offset from the root. The degree fixes the letter (letterStep =
// degree - 1), so an added 9th correctly lands a step above the root instead of
// being mis-spelled as a stacked-third. This is what makes add9 / 6 / sus behave.
const CHORD_INTERVALS = {
  major: [[1, 0], [3, 4], [5, 7]],
  minor: [[1, 0], [3, 3], [5, 7]],
  diminished: [[1, 0], [3, 3], [5, 6]],
  augmented: [[1, 0], [3, 4], [5, 8]],
  sus2: [[1, 0], [2, 2], [5, 7]],
  sus4: [[1, 0], [4, 5], [5, 7]],
  major7: [[1, 0], [3, 4], [5, 7], [7, 11]],
  dominant7: [[1, 0], [3, 4], [5, 7], [7, 10]],
  minor7: [[1, 0], [3, 3], [5, 7], [7, 10]],
  half_diminished7: [[1, 0], [3, 3], [5, 6], [7, 10]],
  diminished7: [[1, 0], [3, 3], [5, 6], [7, 9]],
  'minor-major7': [[1, 0], [3, 3], [5, 7], [7, 11]],
  major6: [[1, 0], [3, 4], [5, 7], [6, 9]],
  minor6: [[1, 0], [3, 3], [5, 7], [6, 9]],
  add9: [[1, 0], [3, 4], [5, 7], [9, 14]],
  minor_add9: [[1, 0], [3, 3], [5, 7], [9, 14]],
  dominant9: [[1, 0], [3, 4], [5, 7], [7, 10], [9, 14]],
  major9: [[1, 0], [3, 4], [5, 7], [7, 11], [9, 14]],
  minor9: [[1, 0], [3, 3], [5, 7], [7, 10], [9, 14]],
};

// Semitone-only view, for data files that expect flat arrays.
const CHORD_FORMULAS = Object.fromEntries(
  Object.entries(CHORD_INTERVALS).map(([q, tones]) => [q, tones.map(([, s]) => s)])
);

const SYMBOL_SUFFIX = {
  major: '', minor: 'm', diminished: 'dim', augmented: 'aug',
  sus2: 'sus2', sus4: 'sus4',
  major7: 'maj7', dominant7: '7', minor7: 'm7',
  half_diminished7: 'm7b5', diminished7: 'dim7', 'minor-major7': 'm(maj7)',
  major6: '6', minor6: 'm6', add9: 'add9', minor_add9: 'm(add9)',
  dominant9: '9', major9: 'maj9', minor9: 'm9',
};

/** Spell a chord: root + quality -> ordered array of note strings. */
function buildChordNotes(root, quality) {
  const tones = CHORD_INTERVALS[quality];
  if (!tones) throw new Error(`Unknown chord quality: ${quality}`);
  const rootNote = typeof root === 'string' ? parseNote(root) : root;
  return tones.map(([deg, semis]) => spellFrom(rootNote, deg - 1, semis));
}

function buildChord(root, quality) {
  const rootNote = typeof root === 'string' ? parseNote(root) : root;
  const notes = buildChordNotes(rootNote, quality).map(noteToString);
  return { root: noteToString(rootNote), quality, notes, symbol: chordSymbol(rootNote, quality) };
}

function chordSymbol(root, quality) {
  const rootStr = typeof root === 'string' ? root : noteToString(root);
  const suffix = SYMBOL_SUFFIX[quality] ?? quality;
  return rootStr + suffix;
}

/** Classify a TRIAD from the pitch-class intervals of its three notes. */
function classifyTriad(notes) {
  const [r, third, fifth] = notes.map((n) => (typeof n === 'string' ? parseNote(n) : n));
  const rp = pitchClass(r);
  const i3 = (((pitchClass(third) - rp) % 12) + 12) % 12;
  const i5 = (((pitchClass(fifth) - rp) % 12) + 12) % 12;
  if (i3 === 4 && i5 === 7) return 'major';
  if (i3 === 3 && i5 === 7) return 'minor';
  if (i3 === 3 && i5 === 6) return 'diminished';
  if (i3 === 4 && i5 === 8) return 'augmented';
  if (i3 === 2 && i5 === 7) return 'sus2';
  if (i3 === 5 && i5 === 7) return 'sus4';
  return 'unknown';
}

/** Classify a seventh chord from four notes. */
function classifySeventh(notes) {
  const triadQ = classifyTriad(notes.slice(0, 3));
  const r = typeof notes[0] === 'string' ? parseNote(notes[0]) : notes[0];
  const seventh = typeof notes[3] === 'string' ? parseNote(notes[3]) : notes[3];
  const i7 = (((pitchClass(seventh) - pitchClass(r)) % 12) + 12) % 12;
  if (triadQ === 'major' && i7 === 11) return 'major7';
  if (triadQ === 'major' && i7 === 10) return 'dominant7';
  if (triadQ === 'minor' && i7 === 10) return 'minor7';
  if (triadQ === 'minor' && i7 === 11) return 'minor-major7';
  if (triadQ === 'diminished' && i7 === 10) return 'half_diminished7';
  if (triadQ === 'diminished' && i7 === 9) return 'diminished7';
  return 'unknown';
}


// ===== src/theory/RomanNumeralEngine.js =====
// RomanNumeralEngine.js
// Parses a roman-numeral token and spells the actual chord in a given key.
// Deterministic: the code decides root + quality, never an LLM.

const DEGREE_BY_ROMAN = { I: 0, II: 1, III: 2, IV: 3, V: 4, VI: 5, VII: 6 };

// Ordered longest-first so "vii" matches before "v", "iii" before "ii"/"i", etc.
const ROMAN_TOKENS = ['VII', 'III', 'VI', 'IV', 'II', 'V', 'I'];

/**
 * Parse a roman numeral like: I, vi, ii°, V7, viiø7, bVII, iv, V/vi, V7/V.
 * Returns { flats, sharps, romanUpper, isLower, qualityHint, applied }.
 */
function parseRoman(input) {
  let s = input.trim();
  let applied = null;
  const slash = s.indexOf('/');
  if (slash !== -1) {
    applied = s.slice(slash + 1);
    s = s.slice(0, slash);
  }

  let flats = 0, sharps = 0;
  while (s[0] === 'b' || s[0] === '♭') { flats++; s = s.slice(1); }
  while (s[0] === '#' || s[0] === '♯') { sharps++; s = s.slice(1); }

  // Find the roman-letter core (case-insensitive), longest match first.
  let romanUpper = null, isLower = false, rest = '';
  const up = s.toUpperCase();
  for (const tok of ROMAN_TOKENS) {
    if (up.startsWith(tok)) {
      romanUpper = tok;
      isLower = s[0] === s[0].toLowerCase() && s[0] !== s[0].toUpperCase();
      rest = s.slice(tok.length);
      break;
    }
  }
  if (romanUpper === null) throw new Error(`Cannot parse roman numeral: "${input}"`);

  return { flats, sharps, romanUpper, isLower, qualityHint: rest, applied };
}

// Map the trailing symbols + case to a chord quality.
function qualityFrom(isLower, hint) {
  const h = hint.replace(/\s+/g, '');
  if (h === '°7' || h === 'o7' || h === 'dim7') return 'diminished7';
  if (h === 'ø7' || h === 'm7b5') return 'half_diminished7';
  if (h === '°' || h === 'o' || h === 'dim') return 'diminished';
  if (h === '+' || h === 'aug') return 'augmented';
  if (h === 'maj7' || h === 'M7') return 'major7';
  if (h === '7') return isLower ? 'minor7' : 'dominant7';
  if (h === 'sus4') return 'sus4';
  if (h === 'sus2') return 'sus2';
  if (h === '') return isLower ? 'minor' : 'major';
  // default: keep triad quality by case
  return isLower ? 'minor' : 'major';
}

/** Root note for a diatonic degree in a key (before any b/# alteration). */
function diatonicRoot(keyTonic, mode, degreeIndex) {
  const scaleName = mode === 'minor' ? 'natural_minor' : 'major';
  return buildScaleNotes(keyTonic, scaleName)[degreeIndex];
}

function applyChromatic(rootNote, flats, sharps) {
  return { letter: rootNote.letter, accidental: rootNote.accidental - flats + sharps };
}

/**
 * Spell the chord for a roman numeral in a key.
 * key = { tonic: 'C', mode: 'major'|'minor' }.
 * Returns the ChordEngine chord object plus { roman, appliedTarget }.
 */
function romanToChord(input, key) {
  const p = parseRoman(input);

  // Applied / secondary chord: build the chord as the dominant (or requested
  // quality) of its target, so V/vi in C -> E major (a P5 above the vi root A).
  if (p.applied) {
    const target = parseRoman(p.applied);
    const targetDegree = DEGREE_BY_ROMAN[target.romanUpper];
    let targetRoot = diatonicRoot(key.tonic, key.mode, targetDegree);
    targetRoot = applyChromatic(targetRoot, target.flats, target.sharps);
    // Root of the applied chord = perfect fifth above the target root.
    const appliedRoot = spellFrom(targetRoot, 4, 7);
    const quality = qualityFrom(p.isLower, p.qualityHint) === 'major' && p.qualityHint === '7'
      ? 'dominant7'
      : qualityFrom(p.isLower, p.qualityHint);
    const chord = buildChord(noteToString(appliedRoot), p.qualityHint.includes('7') ? 'dominant7' : quality);
    return { ...chord, roman: input, appliedTarget: noteToString(targetRoot) };
  }

  const degreeIndex = DEGREE_BY_ROMAN[p.romanUpper];
  let root = diatonicRoot(key.tonic, key.mode, degreeIndex);
  root = applyChromatic(root, p.flats, p.sharps);
  const quality = qualityFrom(p.isLower, p.qualityHint);
  const chord = buildChord(noteToString(root), quality);
  return { ...chord, roman: input, appliedTarget: null };
}

/** Spell an entire progression given as roman numerals. */
function progressionToChords(romans, key) {
  return romans.map((r) => romanToChord(r, key));
}


// ===== src/model/provenance.js =====
// provenance.js
// Every piece of content in a song carries where it came from. This is a product
// feature, not bookkeeping: the writer can always see what is theirs versus what
// was suggested, and the app can never silently merge AI text into user text.

const PROVENANCE = Object.freeze({
  USER: 'USER',
  AI_SUGGESTION: 'AI_SUGGESTION',
  SYSTEM_ANALYSIS: 'SYSTEM_ANALYSIS',
  THEORY_ENGINE: 'THEORY_ENGINE',
});

const VALID = new Set(Object.values(PROVENANCE));

let _counter = 0;
function nextId() {
  _counter += 1;
  return `frag_${Date.now().toString(36)}_${_counter}`;
}

/**
 * Create a content fragment. `history` records prior versions so a replacement
 * is always reversible.
 */
function createFragment(text, provenance, meta = {}) {
  if (!VALID.has(provenance)) throw new Error(`Invalid provenance: ${provenance}`);
  return {
    id: nextId(),
    text,
    provenance,
    meta,
    createdAt: new Date().toISOString(),
    history: [],
  };
}

/**
 * Replace a fragment's text. USER-authored text is protected: it can only be
 * replaced when the caller explicitly passes { intent: 'user_confirmed' }, which
 * models an explicit user action in the UI. Any replacement is reversible via
 * history. The function returns a NEW fragment object (immutable update).
 */
function replaceText(fragment, newText, newProvenance, opts = {}) {
  if (!VALID.has(newProvenance)) throw new Error(`Invalid provenance: ${newProvenance}`);
  if (fragment.provenance === PROVENANCE.USER && opts.intent !== 'user_confirmed') {
    throw new Error(
      'Refusing to overwrite USER-authored text without an explicit user_confirmed intent.'
    );
  }
  return {
    ...fragment,
    text: newText,
    provenance: newProvenance,
    history: [
      ...fragment.history,
      { text: fragment.text, provenance: fragment.provenance, at: fragment.createdAt },
    ],
    createdAt: new Date().toISOString(),
  };
}

/** Revert a fragment to its most recent historical version. */
function revert(fragment) {
  if (fragment.history.length === 0) return fragment;
  const prev = fragment.history[fragment.history.length - 1];
  return {
    ...fragment,
    text: prev.text,
    provenance: prev.provenance,
    history: fragment.history.slice(0, -1),
    createdAt: new Date().toISOString(),
  };
}

/** Convenience factories for engine/system output, which are always tagged. */
const asTheoryEngine = (text, meta) => createFragment(text, PROVENANCE.THEORY_ENGINE, meta);
const asSystemAnalysis = (text, meta) => createFragment(text, PROVENANCE.SYSTEM_ANALYSIS, meta);
const asAiSuggestion = (text, meta) => createFragment(text, PROVENANCE.AI_SUGGESTION, meta);
const asUser = (text, meta) => createFragment(text, PROVENANCE.USER, meta);


// ===== src/model/projectState.js =====
// projectState.js
// The serializable state of one song project. Local-first: this whole object is
// what gets persisted (and is exportable/deletable). It deliberately stores only
// what the writer supplied plus tagged suggestions — no inferred meaning, no
// automatic truth scores.


const SCHEMA_VERSION = 3;

let _projSeq = 0;
function newProjectId() {
  _projSeq += 1;
  const rand = Math.random().toString(36).slice(2, 8);
  return `proj_${Date.now().toString(36)}_${_projSeq}_${rand}`;
}

function createProject({ title = 'Untitled', tonalCenter = null } = {}) {
  return {
    schemaVersion: SCHEMA_VERSION,
    id: newProjectId(),
    title,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    // Sections hold ordered lyric fragments and an optional harmonic plan.
    sections: [],
    // Loose raw material captured during discovery, before it becomes lyric.
    rawMaterial: [],
    // Harmonic auditions the writer has selected as "closer to what I mean".
    selectedCandidates: [],
    // Open discovery questions the writer has not answered. Context only.
    openQuestions: [],
    // Discovery session progress, so a returning writer resumes where they left off.
    discovery: null,
    // Named snapshots of prior states. The writer's history is never silently lost.
    versions: [],
    // Chosen song structure (from structure_recipes), if the writer picked one.
    structure: null,
    // Performance notes for handoff: tempo (BPM) and feel, set by the writer.
    meta: { tempo: null, feel: null },
    settings: {
      tonalCenter,
      listenBlind: false,
      interventionMode: 'coach', // coach | help | collaborate | rescue
      agePosture: '13+',
    },
  };
}

function touch(project) {
  project.updatedAt = new Date().toISOString();
  return project;
}

function addSection(project, { name, goal = null, role = null, structureRule = null } = {}) {
  const section = {
    id: `sec_${project.sections.length + 1}`,
    name,
    role,                 // structural role, e.g. "Verse 2" (from a structure recipe)
    goal,                 // e.g. "verse advances the story" — the writer's own words
    structureRule: structureRule, // the recipe's rule for this form, as guidance
    fragments: [],        // provenance-tagged fragments
    experiments: [],      // craft experiments the writer has opted into
    harmonicPlan: null,   // { grammar, tonalCenter, romanNumerals, relationToWords }
    truthRating: null,    // 1-5, ONLY ever set by the user
  };
  project.sections.push(section);
  touch(project);
  return section;
}

function addFragment(project, sectionId, fragment) {
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  section.fragments.push(fragment);
  touch(project);
  return section;
}

/**
 * Truth ratings are self-report only. This helper refuses any attempt to set a
 * rating without an explicit user source, enforcing ui_copy's "never score truth
 * automatically" rule at the data layer.
 */
function setTruthRating(project, sectionId, rating, source) {
  if (source !== 'user') {
    throw new Error('Truth ratings may only be set by the user.');
  }
  if (!Number.isInteger(rating) || rating < 1 || rating > 5) {
    throw new Error('Truth rating must be an integer 1-5.');
  }
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  section.truthRating = rating;
  touch(project);
  return section;
}

/** Attach a harmonic plan to a section (from an audition the writer chose). */
function setHarmonicPlan(project, sectionId, plan) {
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  const REQUIRED = ['grammar', 'tonalCenter', 'romanNumerals'];
  for (const k of REQUIRED) {
    if (!(k in plan)) throw new Error(`Harmonic plan missing "${k}"`);
  }
  section.harmonicPlan = { relationToWords: 'ambiguous', ...plan };
  touch(project);
  return section;
}

/**
 * Capture a raw discovery entry. Raw material is always the writer's own words,
 * so it is tagged USER; `questionId` records which prompt drew it out (the start
 * of the source trace that Phase 3's truth system builds on). The entry must be
 * a USER-provenance fragment.
 */
function addRawMaterial(project, entry) {
  if (entry.provenance !== PROVENANCE.USER) {
    throw new Error('Raw material must be USER-authored.');
  }
  project.rawMaterial.push(entry);
  touch(project);
  return entry;
}

/** Store discovery-session progress on the project so it survives save/reload. */
function setDiscoverySession(project, session) {
  project.discovery = session;
  touch(project);
  return session;
}

/** Find a fragment anywhere in the project's sections. */
/**
 * Record the writer's answer to "does this harmony/lyric relationship feel true?".
 * This is meaning, so it is the writer's alone — the helper refuses any non-user
 * source, and the app never decides it for them.
 */
function setRelationshipFeedback(project, sectionId, feedback, source) {
  if (source !== 'user') throw new Error('Relationship feedback may only be set by the user.');
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  section.relationshipFeedback = {
    feelsTrue: feedback.feelsTrue ?? null, // true | false | null
    note: feedback.note ?? null,
    at: new Date().toISOString(),
  };
  touch(project);
  return section.relationshipFeedback;
}

/** Set performance notes for handoff (tempo in BPM, feel description). */
function setSongMeta(project, { tempo, feel } = {}) {
  if (!project.meta) project.meta = { tempo: null, feel: null };
  if (tempo !== undefined) project.meta.tempo = tempo;
  if (feel !== undefined) project.meta.feel = feel;
  touch(project);
  return project.meta;
}

/** Record the chosen song structure (from a structure recipe). */
function setStructure(project, structure) {
  project.structure = structure;
  touch(project);
  return structure;
}

/** Set a section's goal. The goal is the writer's own intention, in their words. */
function setSectionGoal(project, sectionId, goal) {
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  section.goal = goal;
  touch(project);
  return section;
}

/**
 * Attach a craft experiment the writer has opted into. An experiment records the
 * craft move being tried; it never generates lyric text (that stays the writer's,
 * or a Phase 6 tagged suggestion). Non-destructive.
 */
function addSectionExperiment(project, sectionId, experiment) {
  const section = project.sections.find((s) => s.id === sectionId);
  if (!section) throw new Error(`No section ${sectionId}`);
  if (!Array.isArray(section.experiments)) section.experiments = [];
  section.experiments.push(experiment);
  touch(project);
  return experiment;
}

function findFragment(project, fragmentId) {
  for (const section of project.sections) {
    const index = section.fragments.findIndex((f) => f.id === fragmentId);
    if (index !== -1) return { section, fragment: section.fragments[index], index };
  }
  return null;
}

/**
 * Promote a piece of raw material into a workable fragment in a section. The
 * fragment keeps a source reference back to the raw entry (and through it, the
 * discovery question) so "where did this line come from?" is always answerable.
 * Extraction is non-destructive: the raw entry stays on the board. An optional
 * `span` selects a substring of the raw text; the extracted words are the
 * writer's own, so the fragment is USER-authored.
 */
function extractFragment(project, { rawMaterialId, sectionId, span = null, note = null }) {
  const raw = project.rawMaterial.find((r) => r.id === rawMaterialId);
  if (!raw) throw new Error(`No raw material ${rawMaterialId}`);
  let text = raw.text;
  if (span) {
    const [a, b] = span;
    if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b > raw.text.length || a >= b) {
      throw new Error('Invalid span for extraction.');
    }
    text = raw.text.slice(a, b);
  }
  const fragment = asUser(text, {
    source: { type: 'raw_material', rawMaterialId, questionId: raw.meta?.questionId ?? null, span },
    note,
  });
  addFragment(project, sectionId, fragment); // touches the project
  return fragment;
}

/**
 * Set a fragment's truth rating. Like section ratings, this is self-report only
 * and refuses any non-user source, so nothing in the app ever scores truth for
 * the writer.
 */
function setFragmentTruth(project, fragmentId, rating, source) {
  if (source !== 'user') throw new Error('Truth ratings may only be set by the user.');
  if (!Number.isInteger(rating) || rating < 1 || rating > 5) {
    throw new Error('Truth rating must be an integer 1-5.');
  }
  const found = findFragment(project, fragmentId);
  if (!found) throw new Error(`No fragment ${fragmentId}`);
  found.fragment.truthRating = rating;
  touch(project);
  return found.fragment;
}

/**
 * Replace a fragment's text, routing through the provenance guard: USER text can
 * only be overwritten with an explicit user_confirmed intent, so AI or system
 * changes can never silently replace the writer's words. A text change also
 * clears any truth rating, because that self-report was about the old words.
 */
function replaceFragmentText(project, fragmentId, newText, provenance = PROVENANCE.USER, opts = {}) {
  const found = findFragment(project, fragmentId);
  if (!found) throw new Error(`No fragment ${fragmentId}`);
  const updated = replaceText(found.fragment, newText, provenance, opts);
  if ('truthRating' in found.fragment) updated.truthRating = null;
  found.section.fragments[found.index] = updated;
  touch(project);
  return updated;
}

/** Revert a fragment to its previous version. */
function revertFragmentById(project, fragmentId) {
  const found = findFragment(project, fragmentId);
  if (!found) throw new Error(`No fragment ${fragmentId}`);
  const reverted = revert(found.fragment);
  found.section.fragments[found.index] = reverted;
  touch(project);
  return reverted;
}

let _snapSeq = 0;
/** Save a named snapshot of the current state (minus the snapshot list itself). */
function createSnapshot(project, label = null) {
  _snapSeq += 1;
  const { versions, ...rest } = project;
  const snapshot = {
    id: `ver_${Date.now().toString(36)}_${_snapSeq}`,
    label,
    at: new Date().toISOString(),
    state: JSON.parse(JSON.stringify(rest)),
  };
  project.versions.push(snapshot);
  touch(project);
  return snapshot;
}

/**
 * Restore a snapshot. The current state is snapshotted first, so restoring never
 * throws away the writer's latest work — they can always come back.
 */
function restoreSnapshot(project, snapshotId) {
  const snap = project.versions.find((v) => v.id === snapshotId);
  if (!snap) throw new Error(`No version ${snapshotId}`);
  createSnapshot(project, 'auto: state before restore');
  const restored = JSON.parse(JSON.stringify(snap.state));
  const keptVersions = project.versions;
  for (const key of Object.keys(project)) {
    if (key === 'versions') continue;
    delete project[key];
  }
  Object.assign(project, restored);
  project.versions = keptVersions;
  project.schemaVersion = SCHEMA_VERSION;
  touch(project);
  return project;
}

/** Bring an older saved project up to the current schema (additive only). */
function migrateProject(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  const o = { ...obj };
  if (!Array.isArray(o.versions)) o.versions = [];
  if (!o.meta) o.meta = { tempo: null, feel: null };
  if (o.schemaVersion < SCHEMA_VERSION) o.schemaVersion = SCHEMA_VERSION;
  return o;
}

function serialize(project) {
  return JSON.stringify(project);
}

function deserialize(json) {
  const obj = typeof json === 'string' ? JSON.parse(json) : json;
  const migrated = migrateProject(obj);
  const errors = validateProject(migrated);
  if (errors.length) throw new Error(`Invalid project: ${errors.join('; ')}`);
  return migrated;
}

/** Structural validation of a project object. Returns an array of error strings. */
function validateProject(p) {
  const errors = [];
  if (!p || typeof p !== 'object') return ['project is not an object'];
  if (p.schemaVersion !== SCHEMA_VERSION) errors.push(`schemaVersion must be ${SCHEMA_VERSION}`);
  if (typeof p.title !== 'string') errors.push('title must be a string');
  if (!Array.isArray(p.rawMaterial)) errors.push('rawMaterial must be an array');
  else for (const r of p.rawMaterial) {
    if (r.provenance !== PROVENANCE.USER) {
      errors.push(`raw material ${r.id} must be USER-authored (got ${r.provenance})`);
    }
  }
  if (!Array.isArray(p.versions)) errors.push('versions must be an array');
  if (!Array.isArray(p.sections)) errors.push('sections must be an array');
  else {
    for (const s of p.sections) {
      if (s.truthRating !== null && !(Number.isInteger(s.truthRating) && s.truthRating >= 1 && s.truthRating <= 5)) {
        errors.push(`section ${s.id}: truthRating must be null or 1-5`);
      }
      if (!Array.isArray(s.fragments)) errors.push(`section ${s.id}: fragments must be an array`);
      else for (const f of s.fragments) {
        if (!Object.values(PROVENANCE).includes(f.provenance)) {
          errors.push(`section ${s.id}: fragment ${f.id} has invalid provenance ${f.provenance}`);
        }
        if ('truthRating' in f && f.truthRating != null
          && !(Number.isInteger(f.truthRating) && f.truthRating >= 1 && f.truthRating <= 5)) {
          errors.push(`section ${s.id}: fragment ${f.id} truthRating must be null or 1-5`);
        }
      }
    }
  }
  return errors;
}


// ===== src/sound/intent.js =====
// intent.js — the MusicalIntent object. These are the dials the writer sets in
// the Sound Room. Every one describes what the music should DO; none of them is
// an emotion. The engine translates these into musical parameters.

const PALETTES = ['MAJOR', 'MINOR', 'MODAL', 'MIXED', 'OPEN'];
const GRAMMARS = ['FUNCTIONAL_TONAL', 'CYCLIC_POP', 'MODAL_STATIC', 'AUTO'];
const PROFILES = [
  'SETTLE', 'BUILD_RELEASE', 'STAY_OPEN', 'CIRCLE', 'HOLD_STILL', 'RESTLESS',
  'BRIGHT_SURFACE_SHADOW', 'DARK_SURFACE_OPENING',
];
const RELATION_TO_WORDS = ['SUPPORT', 'COUNTERPOINT', 'AMBIGUOUS'];
const TEXTURES = ['block', 'pad', 'arpeggio'];

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const clampInt = (n, lo, hi) => clamp(Math.round(n), lo, hi);

/** Build a normalized MusicalIntent from a partial set of writer choices. */
function createIntent(partial = {}) {
  const palette = PALETTES.includes(partial.palette) ? partial.palette : 'OPEN';
  return {
    tonalCenter: partial.tonalCenter || 'C',
    palette,
    grammar: GRAMMARS.includes(partial.grammar) ? partial.grammar : 'AUTO',
    profile: PROFILES.includes(partial.profile) ? partial.profile : 'SETTLE',
    complexity: clampInt(partial.complexity ?? 1, 1, 5),
    chromaticColor: clampInt(partial.chromaticColor ?? 0, 0, 100),
    harmonicMotion: clampInt(partial.harmonicMotion ?? 50, 0, 100),
    resolution: clampInt(partial.resolution ?? 50, 0, 100),
    relationToWords: RELATION_TO_WORDS.includes(partial.relationToWords)
      ? partial.relationToWords : 'AMBIGUOUS',
    tempo: clampInt(partial.tempo ?? 84, 40, 200),
    playbackTexture: TEXTURES.includes(partial.playbackTexture) ? partial.playbackTexture : 'pad',
  };
}

/** The mode implied by a palette (the engine works in major/minor tonics). */
function modeForPalette(palette) {
  return palette === 'MINOR' ? 'minor' : 'major';
}


// ===== src/sound/ProgressionEngine.js =====
// ProgressionEngine.js
// Generates a roman-numeral skeleton from constraints (grammar, profile,
// palette, complexity, color) and spells it. It generates from templates plus
// deterministic modifiers — never from an LLM completion. Given the same intent
// it produces the same progression (reproducible by construction).

// Skeletons are grouped by SHAPE, not by emotion. Each shape has a major and a
// minor form. The engine picks a shape from the profile and a grammar, then
// applies complexity/color modifiers.
const SHAPES = {
  ARRIVE: { major: ['I', 'IV', 'V', 'I'], minor: ['i', 'iv', 'V', 'i'], cadence: 'authentic' },
  BUILD: { major: ['I', 'vi', 'IV', 'V', 'I'], minor: ['i', 'VI', 'iv', 'V', 'i'], cadence: 'authentic' },
  OPEN: { major: ['I', 'IV', 'ii', 'V'], minor: ['i', 'iv', 'ii°', 'V'], cadence: 'half' },
  LOOP: { major: ['I', 'V', 'vi', 'IV'], minor: ['i', 'VI', 'III', 'VII'], cadence: 'none' },
  STATIC: { major: ['I', 'bVII', 'IV', 'I'], minor: ['i', 'VII', 'i', 'VII'], cadence: 'none' },
};

// Profile -> default shape.
const PROFILE_SHAPE = {
  SETTLE: 'ARRIVE',
  BUILD_RELEASE: 'BUILD',
  STAY_OPEN: 'OPEN',
  CIRCLE: 'LOOP',
  HOLD_STILL: 'STATIC',
  RESTLESS: 'BUILD',
  BRIGHT_SURFACE_SHADOW: 'ARRIVE',
  DARK_SURFACE_OPENING: 'ARRIVE',
};

// Which shapes each grammar can host.
const GRAMMAR_SHAPES = {
  FUNCTIONAL_TONAL: ['ARRIVE', 'BUILD', 'OPEN'],
  CYCLIC_POP: ['LOOP'],
  MODAL_STATIC: ['STATIC'],
};

/** Resolve AUTO to a concrete grammar based on the profile's shape. */
function resolveGrammar(intent) {
  if (intent.grammar !== 'AUTO') return intent.grammar;
  const shape = PROFILE_SHAPE[intent.profile] || 'ARRIVE';
  if (shape === 'LOOP') return 'CYCLIC_POP';
  if (shape === 'STATIC') return 'MODAL_STATIC';
  return 'FUNCTIONAL_TONAL';
}

// Pick a shape that both the grammar allows and the profile suggests.
function pickShape(grammar, profile) {
  const allowed = GRAMMAR_SHAPES[grammar];
  const wanted = PROFILE_SHAPE[profile] || 'ARRIVE';
  if (allowed.includes(wanted)) return wanted;
  return allowed[0];
}

// Add a seventh to a plain roman token (leaves already-extended tokens alone).
function addSeventh(roman) {
  if (/7|°|ø|maj/.test(roman)) return roman;
  if (roman === 'V') return 'V7';
  if (/^[IV]+$/.test(roman)) return `${roman}maj7`; // major diatonic -> maj7
  return `${roman}7`; // minor/other -> plain 7 (parsed as minor7 by case)
}

/**
 * Apply complexity (1-5) and chromatic color (0-100) to a skeleton.
 * - complexity >= 2: seventh on the dominant
 * - complexity >= 3: sevenths across predominant/dominant
 * - complexity >= 4 or color >= 50: one chromatic event
 *     (a borrowed iv before the final tonic in major, or a V/V before V)
 * The change is deterministic and always explainable.
 */
function applyComplexity(romans, intent, mode, shape) {
  let out = [...romans];

  if (intent.complexity >= 3) {
    out = out.map((r) => (r === 'V' || r === 'ii' || r === 'ii°' ? addSeventh(r) : r));
  } else if (intent.complexity >= 2) {
    out = out.map((r) => (r === 'V' ? 'V7' : r));
  }

  const wantChromatic = intent.complexity >= 4 || intent.chromaticColor >= 50
    || intent.profile === 'BRIGHT_SURFACE_SHADOW';
  if (wantChromatic && mode === 'major') {
    const lastIdx = out.length - 1;
    // Prefer a borrowed iv slid in before a final tonic (I ... IV iv I).
    if (out[lastIdx] === 'I' && !out.includes('iv')) {
      out.splice(lastIdx, 0, 'iv');
    } else {
      // Otherwise tonicize the dominant with a secondary dominant.
      const vIdx = out.findIndex((r) => r === 'V' || r === 'V7');
      if (vIdx > 0 && !out.includes('V/V')) out.splice(vIdx, 0, 'V/V');
    }
  }
  return out;
}

/**
 * Generate a single spelled progression for an intent, optionally overriding the
 * grammar and shape (the AuditionEngine uses overrides to build A/B/C).
 * Returns { grammar, shape, tonalCenter, mode, romanNumerals, chords }.
 */
function generateProgression(intent, override = {}) {
  const grammar = override.grammar || resolveGrammar(intent);
  const shape = override.shape || pickShape(grammar, intent.profile);
  const mode = override.mode || modeForPalette(intent.palette);
  const template = SHAPES[shape][mode] || SHAPES[shape].major;
  const romans = applyComplexity(template, intent, mode, shape);
  const key = { tonic: intent.tonalCenter, mode };
  const chords = progressionToChords(romans, key);
  return { grammar, shape, tonalCenter: intent.tonalCenter, mode, romanNumerals: romans, chords, cadence: SHAPES[shape].cadence };
}



// ===== src/sound/VoicingEngine.js =====
// VoicingEngine.js
// Turns spelled chords into playable voicings (MIDI note numbers), keeping the
// root in the bass and moving the upper voices as little as possible from chord
// to chord. Low voice-leading cost is a musical convenience here, never an
// "emotional" score.

const BASS_LOW = 48;   // C3
const BASS_HIGH = 59;  // B3
const UPPER_LOW = 60;  // C4
const UPPER_HIGH = 79; // G5
const UPPER_TARGET = 67; // G4, where upper voices sit when there is no previous chord

// Place a pitch class as a MIDI note inside [lo, hi] nearest to `target`.
function pcNearest(pc, target, lo, hi) {
  let best = null;
  for (let m = lo; m <= hi; m += 1) {
    if (((m % 12) + 12) % 12 !== pc) continue;
    if (best === null || Math.abs(m - target) < Math.abs(best - target)) best = m;
  }
  return best;
}

// Nearest MIDI for a pitch class to the closest of several previous notes.
function pcNearestToSet(pc, prevMidis) {
  const target = prevMidis.length
    ? prevMidis.reduce((a, b) => a + b, 0) / prevMidis.length
    : UPPER_TARGET;
  let best = null;
  for (let m = UPPER_LOW; m <= UPPER_HIGH; m += 1) {
    if (((m % 12) + 12) % 12 !== pc) continue;
    const d = prevMidis.length ? Math.min(...prevMidis.map((p) => Math.abs(p - m))) : Math.abs(m - target);
    if (best === null || d < best.d) best = { m, d };
  }
  return best.m;
}

/**
 * Voice a progression. Returns an array of voicings; each voicing is
 * { bass, upper: [...], midi: [...sorted] }. Also returns the total upper-voice
 * motion as a transparent number.
 */
function voiceProgression(chords) {
  const voicings = [];
  let prevUpper = [];
  let totalMotion = 0;

  for (const chord of chords) {
    const pcs = chord.notes.map((n) => pitchClass(parseNote(n)));
    const rootPc = pcs[0];
    const bass = pcNearest(rootPc, 54, BASS_LOW, BASS_HIGH); // aim mid-bass
    const upperPcs = pcs.slice(1);
    const upper = [];
    for (const pc of upperPcs) {
      const m = pcNearestToSet(pc, prevUpper);
      upper.push(m);
    }
    upper.sort((a, b) => a - b);

    if (prevUpper.length) {
      // Motion = sum of nearest-voice distances between the two upper sets.
      for (const m of upper) {
        totalMotion += Math.min(...prevUpper.map((p) => Math.abs(p - m)));
      }
    }
    prevUpper = upper;
    voicings.push({ bass, upper, midi: [bass, ...upper].sort((a, b) => a - b) });
  }

  return { voicings, totalMotion };
}


// ===== src/sound/TensionFeatureEngine.js =====
// TensionFeatureEngine.js
// Produces transparent, recomputable structural features for a progression. The
// composite value is explicitly labelled "structural tension" with its components
// disclosed. It is never renamed to an emotion — that boundary is the point.

// Circle-of-fifths distance between two pitch classes (0..6).
function cofDistance(a, b) {
  const d = ((((b - a) * 7) % 12) + 12) % 12;
  return Math.min(d, 12 - d);
}

const DISSONANCE = {
  major: 0, minor: 0, sus2: 0, sus4: 0,
  augmented: 1, diminished: 1,
  major7: 1, dominant7: 1, minor7: 1, 'minor-major7': 1,
  add9: 1, minor_add9: 1, major6: 0, minor6: 0,
  half_diminished7: 2, diminished7: 2, dominant9: 1, major9: 1, minor9: 1,
};

function stripQuality(roman) {
  return roman.replace(/(maj7|ø7|°7|°|ø|7|\+|sus2|sus4)/g, '');
}

// A chord is chromatic to the key if its roman carries an accidental/applied
// mark, or (in major) is the borrowed minor iv.
function isChromatic(roman, mode) {
  if (/[b#]/.test(roman) || roman.includes('/')) return true;
  if (mode === 'major' && /^iv$/.test(stripQuality(roman))) return true;
  return false;
}

function classifyClosure(romans, cadence) {
  const last = stripQuality(romans[romans.length - 1]);
  const prev = romans.length > 1 ? stripQuality(romans[romans.length - 2]) : '';
  const endsTonic = last === 'I' || last === 'i';
  const endsDominant = last === 'V';
  if (endsTonic) return 'closed';
  if ((prev === 'V') && (last === 'vi' || last === 'VI')) return 'deceptive';
  if (endsDominant) return 'open_half';
  if (cadence === 'none') return 'unresolved_loop';
  return 'open_half';
}

const OPENNESS = { closed: 0, deceptive: 0.6, open_half: 0.75, unresolved_loop: 0.5 };
const WEIGHTS = { tonicDistance: 0.2, chromaticism: 0.25, dissonance: 0.2, openness: 0.35 };

/**
 * Compute features for a candidate that has { romanNumerals, chords, tonalCenter,
 * mode, cadence } and an optional voicing motion number.
 */
function computeFeatures(candidate, voiceLeadingMotion = 0) {
  const tonicPc = pitchClass(parseNote(candidate.tonalCenter));
  const per = candidate.chords.map((chord, i) => {
    const rootPc = pitchClass(parseNote(chord.root));
    return {
      roman: candidate.romanNumerals[i],
      cof: cofDistance(tonicPc, rootPc),
      chromatic: isChromatic(candidate.romanNumerals[i], candidate.mode),
      dissonance: DISSONANCE[chord.quality] ?? 0,
    };
  });

  const n = per.length;
  const tonicDistanceAvg = per.reduce((s, p) => s + p.cof, 0) / n;
  const chromaticism = per.filter((p) => p.chromatic).length / n;
  const dissonanceAvg = per.reduce((s, p) => s + p.dissonance, 0) / n / 2; // 0..1
  const closure = classifyClosure(candidate.romanNumerals, candidate.cadence);
  const openness = OPENNESS[closure];

  const norm = {
    tonicDistance: tonicDistanceAvg / 6,
    chromaticism,
    dissonance: dissonanceAvg,
    openness,
  };
  const composite =
    norm.tonicDistance * WEIGHTS.tonicDistance +
    norm.chromaticism * WEIGHTS.chromaticism +
    norm.dissonance * WEIGHTS.dissonance +
    norm.openness * WEIGHTS.openness;

  return {
    perChord: per,
    tonicDistanceAvg: round(tonicDistanceAvg),
    chromaticism: round(chromaticism),
    dissonanceAvg: round(dissonanceAvg),
    closure,
    voiceLeadingMotion,
    harmonicRhythm: n,
    loop: candidate.cadence === 'none',
    structuralTension: {
      label: 'structural tension (composite, not an emotion)',
      value: round(composite),
      components: {
        tonicDistance: round(norm.tonicDistance),
        chromaticism: round(norm.chromaticism),
        dissonance: round(norm.dissonance),
        openness: round(norm.openness),
      },
      weights: WEIGHTS,
    },
  };
}

function round(x) { return Math.round(x * 1000) / 1000; }


// ===== src/sound/ExplanationEngine.js =====
// ExplanationEngine.js
// Builds the WHY panel content for a candidate. Badge taxonomy:
//   THEORY | RESEARCH | CRAFT | HYPOTHESIS | YOUR_MEANING
// Rules enforced here:
//  - THEORY statements are structural and recomputable from engine state.
//  - Any emotional reading is a HYPOTHESIS, hedged and phrased as a question.
//  - YOUR_MEANING is never answered for the writer.
const BADGES = Object.freeze({
  THEORY: 'THEORY', RESEARCH: 'RESEARCH', CRAFT: 'CRAFT',
  HYPOTHESIS: 'HYPOTHESIS', YOUR_MEANING: 'YOUR_MEANING',
});

const GRAMMAR_LABEL = {
  FUNCTIONAL_TONAL: 'functional', CYCLIC_POP: 'cyclic / pop', MODAL_STATIC: 'modal / static',
};

// Words that must never appear in a THEORY (as-fact) statement.
const EMOTION_WORDS = /\b(happy|sad|joy|joyful|grief|griev|anger|angry|anxious|anxiety|fear|scared|depress|melanchol|nostalg|hopeful|hope|longing|yearn|heartbreak|uplifting|somber|cheerful|mournful)\b/i;

const th = (statement) => ({ badge: BADGES.THEORY, statement });
const hyp = (statement) => ({ badge: BADGES.HYPOTHESIS, statement });
const ym = (statement) => ({ badge: BADGES.YOUR_MEANING, statement });

function closureStatement(closure, lastRoman) {
  switch (closure) {
    case 'closed':
      return `It ends on ${lastRoman} and returns to the tonic, so it arrives.`;
    case 'open_half':
      return `It ends on ${lastRoman}, which withholds a full tonic arrival.`;
    case 'deceptive':
      return `The dominant moves to ${lastRoman} instead of the expected tonic, deferring arrival.`;
    case 'unresolved_loop':
      return `The loop ends on ${lastRoman} rather than the tonic, so it keeps moving.`;
    default:
      return `It ends on ${lastRoman}.`;
  }
}

function chromaticStatements(candidate) {
  const out = [];
  candidate.chords.forEach((chord, i) => {
    const roman = candidate.romanNumerals[i];
    const chromatic = /[b#]/.test(roman) || roman.includes('/')
      || (candidate.mode === 'major' && /^iv$/.test(roman));
    if (!chromatic) return;
    if (chord.appliedTarget) {
      out.push(th(`${chord.symbol} (${roman}) is a secondary dominant of ${chord.appliedTarget}.`));
    } else {
      const parallel = candidate.mode === 'major' ? 'minor' : 'major';
      out.push(th(`${chord.symbol} (${roman}) is borrowed from the parallel ${parallel}.`));
    }
  });
  return out;
}

function hypothesisFor(features) {
  const c = features.closure;
  if (features.chromaticism > 0) {
    return hyp('That borrowed color can complicate an otherwise plainer surface — does it feel that way to you?');
  }
  if (c === 'closed') {
    return hyp('A clear arrival can suit a line that lands on something certain — is that what you want here?');
  }
  return hyp('That withheld or delayed arrival can fit a lyric that stays unresolved — does that match what you mean?');
}

/**
 * Explain a candidate. In blind mode, return only the listen-first prompt so no
 * loaded labels reach the writer before they hear it.
 */
function explainCandidate(candidate, features, { blind = false } = {}) {
  if (blind) {
    return [ym('Listen first — which of these is closer to what you mean?')];
  }
  const lastRoman = candidate.romanNumerals[candidate.romanNumerals.length - 1];
  const out = [
    th(`This progression was generated as ${GRAMMAR_LABEL[candidate.grammar]} harmony.`),
    th(closureStatement(features.closure, lastRoman)),
    ...chromaticStatements(candidate),
    hypothesisFor(features),
    ym('What did you hear?'),
    ym('Why does that matter to you?'),
  ];
  return out;
}

/** Explain the single change between a parent and a refined variant. */
function explainChange(variant) {
  return [th(`What changed: ${variant.changeNote}.`), ym('What did that do for you?')];
}

/** Guard: no THEORY statement may assert an emotion; every HYPOTHESIS must hedge. */
function validateExplanations(explanations) {
  const errors = [];
  for (const e of explanations) {
    if (e.badge === BADGES.THEORY && EMOTION_WORDS.test(e.statement)) {
      errors.push(`THEORY states an emotion as fact: "${e.statement}"`);
    }
    if (e.badge === BADGES.HYPOTHESIS) {
      const hedged = /\?$/.test(e.statement) || /\b(can|may|might|could)\b/i.test(e.statement);
      if (!hedged) errors.push(`HYPOTHESIS is not hedged: "${e.statement}"`);
    }
  }
  return errors;
}


// ===== src/sound/AuditionEngine.js =====
// AuditionEngine.js
// Orchestrates the Sound Room: build three meaningfully different candidates for
// an intent, then, once the writer picks one, refine it by mutating just one or
// two dimensions so the change is learnable. No LLM in this path.

let _seq = 0;
const nextCandId = () => `cand_${(_seq += 1)}`;

function rotate(arr, by) {
  const n = arr.length;
  const k = ((by % n) + n) % n;
  return [...arr.slice(k), ...arr.slice(0, k)];
}

function cadenceForLast(lastRoman) {
  const bare = lastRoman.replace(/(maj7|ø7|°7|°|ø|7|\+)/g, '');
  if (bare === 'I' || bare === 'i') return 'authentic';
  if (bare === 'V') return 'half';
  if (bare === 'vi' || bare === 'VI') return 'none';
  return 'none';
}

// Assemble a full candidate from a spelled progression description.
function assemble(prog, { blind, label = null, parentId = null, changeNote = null }) {
  const { voicings, totalMotion } = voiceProgression(prog.chords);
  const features = computeFeatures(prog, totalMotion);
  const explanation = changeNote
    ? [...explainCandidate(prog, features, { blind }), ...explainChange({ changeNote })]
    : explainCandidate(prog, features, { blind });
  return {
    id: nextCandId(),
    label,
    parentId,
    provenance: PROVENANCE.THEORY_ENGINE,
    grammar: prog.grammar,
    shape: prog.shape,
    tonalCenter: prog.tonalCenter,
    mode: prog.mode,
    cadence: prog.cadence,
    romanNumerals: prog.romanNumerals,
    chords: prog.chords,
    voicings,
    structuralFeatures: features,
    explanation,
    changeNote,
  };
}

// Re-spell a mutated roman list into a full prog description.
function respell(romans, base) {
  const key = { tonic: base.tonalCenter, mode: base.mode };
  return {
    grammar: base.grammar,
    shape: base.shape,
    tonalCenter: base.tonalCenter,
    mode: base.mode,
    romanNumerals: romans,
    chords: progressionToChords(romans, key),
    cadence: cadenceForLast(romans[romans.length - 1]),
  };
}

/**
 * Build three candidates for an intent.
 * - AUTO grammar: the three archetypes — functional arrival, cyclic loop, and a
 *   functional line carrying one borrowed/chromatic chord.
 * - Fixed grammar: three treatments within that grammar (distinct shapes if the
 *   grammar allows them, otherwise rotation + added color).
 */
function audition(intent, { blind = false } = {}) {
  const auto = intent.grammar === 'AUTO';
  let plans;
  if (auto) {
    plans = [
      { label: 'A', override: { grammar: 'FUNCTIONAL_TONAL', shape: intent.profile === 'BUILD_RELEASE' ? 'BUILD' : 'ARRIVE' } },
      { label: 'B', override: { grammar: 'CYCLIC_POP', shape: 'LOOP' } },
      { label: 'C', override: { grammar: 'FUNCTIONAL_TONAL', shape: 'ARRIVE' }, colorful: true },
    ];
  } else {
    const shapes = GRAMMAR_SHAPES[intent.grammar];
    if (shapes.length >= 3) {
      plans = [
        { label: 'A', override: { grammar: intent.grammar, shape: shapes[0] } },
        { label: 'B', override: { grammar: intent.grammar, shape: shapes[2] } }, // OPEN
        { label: 'C', override: { grammar: intent.grammar, shape: shapes[0] }, colorful: true },
      ];
    } else {
      plans = [
        { label: 'A', override: { grammar: intent.grammar, shape: shapes[0] } },
        { label: 'B', override: { grammar: intent.grammar, shape: shapes[0], rotate: 1 } },
        { label: 'C', override: { grammar: intent.grammar, shape: shapes[0] }, colorful: true },
      ];
    }
  }

  const candidates = plans.map((plan) => {
    const eff = plan.colorful ? { ...intent, chromaticColor: Math.max(intent.chromaticColor, 60) } : intent;
    let prog = generateProgression(eff, plan.override);
    if (plan.override.rotate) {
      const romans = rotate(prog.romanNumerals, plan.override.rotate);
      prog = respell(romans, prog);
    }
    return assemble(prog, { blind, label: plan.label });
  });

  return { candidates };
}

/**
 * Refine a chosen candidate into three variants, each mutating ONE dimension so
 * the writer can hear exactly what a single change does.
 */
function refine(parent, { blind = false } = {}) {
  const romans = parent.romanNumerals;
  const last = romans[romans.length - 1];
  const bareLast = last.replace(/(maj7|ø7|°7|°|ø|7|\+)/g, '');
  const tonic = parent.mode === 'minor' ? 'i' : 'I';
  const dominant = parent.mode === 'minor' ? 'V' : 'V';
  const submediant = parent.mode === 'minor' ? 'VI' : 'vi';

  // V1 — stronger closure.
  let v1Romans;
  let v1Note;
  if (bareLast !== tonic) {
    v1Romans = [...romans.slice(0, -1), tonic];
    v1Note = `ends on ${tonic} for a stronger arrival`;
  } else {
    v1Romans = [...romans.slice(0, -1), dominant, tonic];
    v1Note = `adds ${dominant} before the tonic to strengthen the arrival`;
  }

  // V2 — remove chromatic color (make everything diatonic and plainer).
  const v2Romans = romans
    .filter((r) => !r.includes('/'))
    .map((r) => (parent.mode === 'major' && /^iv$/.test(r) ? 'IV' : r))
    .map((r) => r.replace(/[b#]/g, '').replace(/(maj7|ø7|°7|7)/g, ''));
  const v2Note = 'removes the borrowed color so the surface stays plain';

  // V3 — withhold arrival (end on the submediant instead of the tonic).
  const v3Romans = [...romans.slice(0, -1), submediant];
  const v3Note = `ends on ${submediant} to withhold the tonic arrival`;

  const variants = [
    { romans: v1Romans, note: v1Note },
    { romans: v2Romans, note: v2Note },
    { romans: v3Romans, note: v3Note },
  ].map((v, i) => {
    const prog = respell(v.romans, parent);
    return assemble(prog, { blind, label: `${parent.label || 'X'}${i + 1}`, parentId: parent.id, changeNote: v.note });
  });

  return { parentId: parent.id, variants };
}


// ===== src/audio/pitch.js =====
// pitch.js — pure audio math (no Web Audio here, so it's testable in Node).

/** Equal-tempered frequency of a MIDI note (A4 = 69 = 440 Hz). */
function midiToFreq(midi) {
  return 440 * 2 ** ((midi - 69) / 12);
}

/**
 * Turn a sequence of voicings into scheduled note events. Pure function: given
 * the same inputs it returns the same schedule, so playback is reproducible.
 * texture: 'block' | 'pad' | 'arpeggio'.
 */
function buildSchedule(voicings, { tempo = 84, texture = 'pad', beatsPerChord = 2 } = {}) {
  const secondsPerBeat = 60 / tempo;
  const chordDur = beatsPerChord * secondsPerBeat;
  const events = [];

  voicings.forEach((v, chordIndex) => {
    const chordStart = chordIndex * chordDur;
    const notes = v.midi;
    if (texture === 'arpeggio') {
      const step = (chordDur / Math.max(notes.length, 1)) * 0.85;
      notes.forEach((midi, i) => {
        const start = chordStart + i * step;
        events.push({ midi, freq: midiToFreq(midi), start, duration: chordStart + chordDur - start, texture });
      });
    } else {
      // block and pad share timing; the envelope differs in the AudioEngine.
      notes.forEach((midi) => {
        events.push({ midi, freq: midiToFreq(midi), start: chordStart, duration: chordDur, texture });
      });
    }
  });

  return { events, totalDuration: voicings.length * chordDur, chordDur };
}


// ===== src/audio/AudioEngine.js =====
// AudioEngine.js — browser-only Web Audio playback.
// Follows the spec's audio rules: one reusable AudioContext created on a user
// gesture, a safe gain envelope (no clicks), neutral timbre, no copyrighted
// samples, and previous playback is stopped before new playback starts.

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.active = []; // currently scheduled nodes, so we can stop them
  }

  /** Create the AudioContext. Must be called from a user gesture (click/tap). */
  ensure() {
    if (this.ctx) return this.ctx;
    const Ctx = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!Ctx) throw new Error('Web Audio is not available in this environment.');
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    return this.ctx;
  }

  /** Stop anything currently sounding, quickly but without a click. */
  stop() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    for (const node of this.active) {
      try {
        node.gain.gain.cancelScheduledValues(now);
        node.gain.gain.setTargetAtTime(0, now, 0.015);
        node.osc.stop(now + 0.1);
      } catch { /* already stopped */ }
    }
    this.active = [];
  }

  /**
   * Play a candidate's voicings. Neutral timbre = a triangle oscillator through a
   * gentle low-pass, with a short attack/soft release so chords do not click.
   */
  play(candidate, { tempo = 84, texture = 'pad' } = {}) {
    this.ensure();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.stop();

    const { events } = buildSchedule(candidate.voicings, { tempo, texture });
    const t0 = this.ctx.currentTime + 0.05;
    const attack = 0.02;
    const release = texture === 'pad' ? 0.5 : 0.12;

    for (const ev of events) {
      const osc = this.ctx.createOscillator();
      osc.type = texture === 'block' ? 'sawtooth' : 'triangle';
      osc.frequency.value = ev.freq;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2200;

      const gain = this.ctx.createGain();
      const start = t0 + ev.start;
      const end = start + ev.duration;
      const peak = 0.16;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start + attack);
      gain.gain.setValueAtTime(peak, Math.max(start + attack, end - release));
      gain.gain.exponentialRampToValueAtTime(0.0001, end);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.master);
      osc.start(start);
      osc.stop(end + 0.05);
      this.active.push({ osc, gain });
    }
  }
}


// ===== src/discovery/DiscoveryEngine.js =====
// DiscoveryEngine.js
// Runs the guided-discovery flow: pick an opener based on how the writer wants
// to start, then walk categories one question at a time, never repeating.
//
// MEANING LOCK, enforced structurally: this engine has no method that produces
// an answer, interpretation, or meaning. It only ever returns questions taken
// verbatim from discovery_questions.json. It cannot diagnose because it cannot
// generate prose at all.

// How the welcome buttons map to an opening question. "have_chords" is the
// Sound-First path (Phase 2), flagged here so the caller can route to it.
const ENTRY_PATHS = {
  one_sentence: { openerId: 'Q001' },
  say_it_ugly: { openerId: 'Q006' },
  only_a_feeling: { openerId: 'Q004' },
  a_story: { openerId: 'Q003' },
  a_line: { openerId: 'Q005' },
  have_chords: { soundFirst: true },
};

// After the opener, questions advance through these categories in order, cycling.
// truth_check is intentionally NOT auto-scheduled — it is offered on demand.
const CATEGORY_SEQUENCE = [
  'scene', 'senses', 'objects', 'stakes', 'dialogue', 'contradiction',
  'perspective', 'forward_motion',
];

// A short list of bare affect words. Its ONLY use is routing: if a writer's
// entry is just "I'm sad", the next question asks for a concrete scene instead of
// moving on (test scenario T001). This is not diagnosis — it does not label the
// writer or infer meaning; it just decides which neutral question comes next.
const BARE_AFFECT = new Set([
  'sad', 'happy', 'angry', 'mad', 'lonely', 'alone', 'scared', 'afraid', 'numb',
  'tired', 'exhausted', 'lost', 'empty', 'fine', 'ok', 'okay', 'anxious',
  'depressed', 'excited', 'nervous', 'hurt', 'broken', 'confused', 'overwhelmed',
  'stressed', 'done', 'good', 'bad',
]);

function isBareAffect(text) {
  if (typeof text !== 'string') return false;
  const t = text
    .toLowerCase()
    .replace(/[.!?,]/g, '')
    .replace(/^(i am|i'm|im|i feel|i just feel|i feel so|i am so|i'm so|so|really|just)\s+/g, '')
    .trim();
  return BARE_AFFECT.has(t);
}

class DiscoveryEngine {
  constructor(questions) {
    this.byId = new Map(questions.map((q) => [q.id, q]));
    this.byCategory = new Map();
    for (const q of questions) {
      if (!this.byCategory.has(q.category)) this.byCategory.set(q.category, []);
      this.byCategory.get(q.category).push(q);
    }
  }

  question(id) {
    const q = this.byId.get(id);
    if (!q) throw new Error(`No question ${id}`);
    return q;
  }

  /**
   * Begin a session. Returns { session, question } — or { session, soundFirst:true }
   * for the "I have chords" path, which the caller routes to the Sound Room.
   */
  start(entryPath = 'one_sentence') {
    const route = ENTRY_PATHS[entryPath] ?? ENTRY_PATHS.one_sentence;
    const session = {
      entryPath,
      askedIds: [],
      categoryIndex: 0,
      done: false,
    };
    if (route.soundFirst) return { session, soundFirst: true };
    const question = this.question(route.openerId);
    session.askedIds.push(question.id);
    return { session, question };
  }

  // First unused question in a category, or null if the category is exhausted.
  _firstUnused(category, askedIds) {
    const pool = this.byCategory.get(category) || [];
    return pool.find((q) => !askedIds.includes(q.id)) || null;
  }

  /**
   * Advance the session. `lastAnswerText` is what the writer just wrote in
   * response to the previous question; it is used ONLY to decide the next
   * question's category (see isBareAffect). Returns { session, question } or
   * { session, question: null } when discovery has run out of scheduled prompts.
   */
  next(session, lastAnswerText = '') {
    const asked = session.askedIds;

    // T001: a bare-affect answer routes to a concrete scene question next,
    // without advancing the normal category pointer.
    if (isBareAffect(lastAnswerText)) {
      const sceneQ = this._firstUnused('scene', asked);
      if (sceneQ) {
        const s = { ...session, askedIds: [...asked, sceneQ.id] };
        return { session: s, question: sceneQ };
      }
    }

    // Walk the category sequence from the current pointer, picking the first
    // category that still has an unused question.
    let idx = session.categoryIndex;
    for (let step = 0; step < CATEGORY_SEQUENCE.length; step += 1) {
      const category = CATEGORY_SEQUENCE[idx % CATEGORY_SEQUENCE.length];
      const q = this._firstUnused(category, asked);
      if (q) {
        const s = {
          ...session,
          askedIds: [...asked, q.id],
          categoryIndex: (idx + 1) % CATEGORY_SEQUENCE.length,
        };
        return { session: s, question: q };
      }
      idx += 1;
    }

    // Everything scheduled has been asked. Discovery does not force more.
    return { session: { ...session, done: true }, question: null };
  }

  /** Offer a truth-check question on demand (never auto-scheduled). */
  truthCheck(session) {
    const q = this._firstUnused('truth_check', session.askedIds);
    if (!q) return { session, question: null };
    return { session: { ...session, askedIds: [...session.askedIds, q.id] }, question: q };
  }
}


// ===== src/discovery/session.js =====
// session.js — the facade the UI calls to run a discovery session.
// Each answer is captured as USER raw material, linked to the question that drew
// it out, and the whole project (including session progress) is persisted after
// every step so a returning writer resumes exactly where they stopped.

class DiscoveryFlow {
  constructor(engine, store) {
    this.engine = engine;
    this.store = store;
  }

  /** Start a new song and its discovery session. */
  async begin({ entryPath = 'one_sentence', title = 'Untitled', tonalCenter = null } = {}) {
    const project = createProject({ title, tonalCenter });
    const started = this.engine.start(entryPath);
    setDiscoverySession(project, started.session);
    await this.store.save(project);
    if (started.soundFirst) return { project, soundFirst: true, question: null };
    return { project, question: started.question, soundFirst: false };
  }

  /** The question currently awaiting an answer (the most recently asked). */
  currentQuestionId(project) {
    const asked = project.discovery?.askedIds ?? [];
    return asked.length ? asked[asked.length - 1] : null;
  }

  /**
   * Record the writer's answer to the current question as raw material, then
   * advance to the next question. Passing an empty answer is allowed (the writer
   * may skip) — nothing is captured, but the flow still advances.
   */
  async submit(project, answerText) {
    const questionId = this.currentQuestionId(project);
    if (answerText && answerText.trim()) {
      addRawMaterial(project, asUser(answerText.trim(), { questionId }));
    }
    const { session, question } = this.engine.next(project.discovery, answerText);
    setDiscoverySession(project, session);
    await this.store.save(project);
    return { project, question };
  }

  /** Offer a truth-check question without capturing anything yet. */
  async requestTruthCheck(project) {
    const { session, question } = this.engine.truthCheck(project.discovery);
    setDiscoverySession(project, session);
    await this.store.save(project);
    return { project, question };
  }

  /** Resume: load a saved project and report the question it was paused on. */
  async resume(id) {
    const project = await this.store.load(id);
    if (!project) return null;
    const questionId = this.currentQuestionId(project);
    const question = questionId ? this.engine.question(questionId) : null;
    return { project, question };
  }
}
